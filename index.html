<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06070C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tablero">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mi tablero</title>
<link rel="manifest" href="manifest.webmanifest" id="manif">
<link rel="icon" type="image/png" sizes="192x192" href="icons/ci-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/ci-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#F4F5F7; --sup:#FFFFFF; --tinta:#0E1119; --gris:#5B6474; --tenue:#98A1B0; --linea:#E7EAEF;
  --azul:#3B6BFF; --azul-o:#1E42B0; --azul-s:#E9EFFF; --sobre-azul:#FFFFFF;
  --rojo:#D11F2A; --rojo-s:#FDECEC; --sobre-rojo:#FFFFFF;
  --viol:#7A5CE0; --verde:#12A150; --ambar:#A85A06; --ambar-s:#FDF1DD;
  --tarj:0 1px 2px rgba(14,17,25,.04),0 10px 30px rgba(14,17,25,.06);
  --sombra:0 14px 44px rgba(14,17,25,.22);
  --texto:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --titulo:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#06070C; --sup:#0E1119; --tinta:#F4F6FA; --gris:#A7AEBC; --tenue:#6B7484; --linea:#1C2130;
  --azul:#6E93FF; --azul-o:#3B6BFF; --azul-s:#141E3D; --sobre-azul:#06070C;
  --rojo:#FF6B6F; --rojo-s:#3A1517; --sobre-rojo:#2A0508;
  --viol:#A892FF; --verde:#4CC38A; --ambar:#F0A44B; --ambar-s:#33240D;
  --tarj:0 0 0 1px #171C29;
  --sombra:0 14px 44px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--texto);font-size:15px;line-height:1.35;overscroll-behavior-y:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
::placeholder{color:var(--tenue);opacity:1}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
h1,h2{margin:0;font:inherit}

.app{max-width:1000px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
.barra{display:flex;align-items:center;gap:6px;padding:8px 4px 10px}
.barra h1{margin-right:auto;white-space:nowrap;font-family:var(--titulo);font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.barra h1 b{font-weight:700;text-transform:capitalize}
.barra h1 span{color:var(--tenue);font-weight:500}
.rb{height:40px;min-width:40px;padding:0 10px;border-radius:12px;display:grid;place-items:center;color:var(--gris);font-weight:600;font-size:14px;position:relative}
.rb:hover{background:var(--linea);color:var(--tinta)}
.rb.hoyb{background:var(--azul-s);color:var(--azul);padding:0 14px}
.conn{position:absolute;top:8px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--tenue);border:1.5px solid var(--fondo)}
.conn.ok{background:var(--verde)} .conn.off{background:var(--ambar)}

/* ---------- saludo: el rojo y el logo de Cursemos ---------- */
.saludo{position:relative;display:block;width:100%;text-align:left;border-radius:22px;padding:16px 108px 17px 18px;margin-bottom:14px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 110% at 88% -20%,#E0303A 0%,rgba(224,48,58,0) 60%),linear-gradient(165deg,#A3121B,#4A0509);box-shadow:var(--tarj)}
.saludo .hola{display:block;font-size:13.5px;font-weight:500;opacity:.82}
.saludo .frase{display:block;font-family:var(--titulo);font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.01em;margin-top:4px;min-height:48px;
  transition:opacity .25s,transform .25s}
.saludo .frase.va{opacity:0;transform:translateY(4px)}
.saludo img{position:absolute;right:16px;top:50%;width:74px;height:auto;transform:translateY(-50%);pointer-events:none}

.cols{display:grid;gap:14px}
.calbox{background:var(--sup);border-radius:22px;padding:12px 8px 8px;overflow:hidden;touch-action:pan-y;box-shadow:var(--tarj)}
.sem{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:600;color:var(--tenue);padding-bottom:4px}
.mes{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.mes.e-der{animation:eder .22s cubic-bezier(.2,.8,.25,1)}
.mes.e-izq{animation:eizq .22s cubic-bezier(.2,.8,.25,1)}
@keyframes eder{from{transform:translateX(36px);opacity:0}}
@keyframes eizq{from{transform:translateX(-36px);opacity:0}}
.d{position:relative;height:50px;display:flex;flex-direction:column;align-items:center;padding-top:4px;gap:3px;border-radius:14px}
.d .n{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-family:var(--titulo);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.d.fuera .n{color:var(--tenue);opacity:.5}
.d.fuera .ms,.d.fuera .tr{opacity:.4}
.d.p .n{color:var(--rojo);font-weight:700}
.d.hoy .n{background:var(--azul);color:var(--sobre-azul);font-weight:700}
.d.hoy.p .n{background:var(--rojo);color:var(--sobre-rojo)}
.d.sel{background:var(--azul-s)}
.d:hover{background:var(--linea)}
.d.sel:hover{background:var(--azul-s)}
.d .ms{display:flex;gap:3px;height:6px;position:relative;z-index:1}
.d .ms i{width:6px;height:6px;border-radius:50%;background:var(--tenue);display:block}
.ms i.m-parcial{background:var(--rojo)} .ms i.m-reunion{background:var(--azul)} .ms i.m-evento{background:var(--viol)}
/* un evento de varios días se ve como una franja que cruza los días */
.d .tr{position:absolute;left:0;right:0;bottom:2px;height:5px;background:var(--viol);opacity:.75}
.d .tr.ini{left:22%;border-radius:3px 0 0 3px}
.d .tr.fin{right:22%;border-radius:0 3px 3px 0}
.d .tr.ini.fin{border-radius:3px}
.d.choque::after{content:"!";position:absolute;top:1px;left:calc(50% + 9px);width:16px;height:16px;border-radius:50%;z-index:2;
  background:var(--rojo);color:var(--sobre-rojo);font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1;border:1.5px solid var(--sup)}

.lado{display:grid;gap:12px;align-content:start}
.aviso{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;
  background:var(--rojo-s);color:var(--rojo);font-size:14.5px;font-weight:500}
.aviso b{font-weight:700}
.aviso svg{flex:none}
.hero{display:block;width:100%;text-align:left;border-radius:22px;padding:18px 18px 16px;color:#F4F6FA;box-shadow:var(--tarj);
  background:radial-gradient(120% 120% at 100% -10%,#2A3350 0%,rgba(42,51,80,0) 60%),linear-gradient(165deg,#141824,#0B0D14)}
.hero.t-parcial{background:radial-gradient(120% 120% at 100% -10%,#6E93FF 0%,rgba(110,147,255,0) 60%),linear-gradient(165deg,#3B6BFF,#1E42B0)}
.hero .ht{display:block;font-size:16px;font-weight:600;line-height:1.25}
.hero .hc{display:block;font-family:var(--titulo);font-size:clamp(32px,9.6vw,44px);font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.08;margin:6px 0 6px}
.hero .hq{display:block;font-size:13.5px;font-weight:500;opacity:.85}
.hero .hq::first-letter{text-transform:uppercase}
.hero .hm{display:block;font-size:14.5px;font-weight:600;margin-top:10px}
.hero .hx{display:block;font-size:13.5px;font-weight:700;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.22)}
.cabl{display:flex;align-items:baseline;gap:10px;padding:6px 6px 0}
.cabl h2{font-family:var(--titulo);font-size:18px;font-weight:700;letter-spacing:-.02em;margin-right:auto}
.cabl h2::first-letter{text-transform:uppercase}
.cabl small{font-size:13px;color:var(--gris)}
.cabl button{font-size:13.5px;font-weight:600;color:var(--azul);padding:4px 2px}
.lista{background:var(--sup);border-radius:20px;overflow:hidden;box-shadow:var(--tarj)}
.it{display:flex;align-items:center;gap:10px;padding:11px 14px 11px 8px;border-bottom:1px solid var(--linea);cursor:pointer;min-height:62px}
.it:last-child{border-bottom:0}
.it:hover{background:color-mix(in srgb,var(--linea) 40%,transparent)}
.it .cu{width:58px;flex:none;text-align:center;line-height:1}
.it .cu b{display:block;font-family:var(--titulo);font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.it .cu b.w{font-size:15px;letter-spacing:-.01em;padding:3px 0}
.it .cu small{display:block;font-size:11px;font-weight:600;color:var(--gris);margin-top:3px}
.it.t-parcial .cu b{color:var(--rojo)} .it.t-reunion .cu b{color:var(--azul)} .it.t-evento .cu b{color:var(--viol)}
.it.tarde .cu b,.it.tarde .cu small{color:var(--rojo)}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-size:15.5px;font-weight:600;line-height:1.3;word-break:break-word}
.it .tx small{display:block;font-size:13px;color:var(--gris);margin-top:1px}
.it .tx em{display:block;font-style:normal;font-size:12.5px;font-weight:700;margin-top:3px;color:var(--rojo)}
.it .tx em.ce{color:var(--ambar)}
.it.ido{opacity:.5}
.it.ido .tx b{text-decoration:line-through}
.chk{width:26px;height:26px;flex:none;border-radius:9px;border:2px solid var(--tenue);display:grid;place-items:center;transition:transform .12s}
.chk:hover{border-color:var(--verde)}
.chk:active{transform:scale(.88)}
.chk.on{background:var(--verde);border-color:var(--verde)}
.chk.on::after{content:"";width:11px;height:6px;border-left:2.2px solid #fff;border-bottom:2.2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.sep{padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--tenue)}
.vacio{padding:26px 20px;text-align:center;color:var(--gris);font-size:14.5px;line-height:1.5}
.vacio b{display:block;color:var(--tinta);font-family:var(--titulo);font-size:18px;font-weight:700;margin-bottom:4px}
.mas{display:block;width:100%;padding:14px;font-size:14px;font-weight:600;color:var(--azul);text-align:center}

.fab{position:fixed;right:max(16px,calc(50vw - 484px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;width:60px;height:60px;border-radius:20px;
  background:linear-gradient(160deg,#5C85FF,#2B55E6);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(59,107,255,.45);transition:transform .12s}
.fab:active{transform:scale(.93)}
.conf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:70;pointer-events:none}

.velo{position:fixed;inset:0;z-index:40;background:rgba(6,7,12,.55);opacity:0;pointer-events:none;transition:opacity .18s}
.hoja{position:fixed;z-index:41;left:50%;top:calc(10px + env(safe-area-inset-top));width:min(460px,calc(100vw - 20px));
  max-height:calc(100dvh - 20px - env(safe-area-inset-top));overflow-y:auto;background:var(--sup);border-radius:24px;padding:16px;box-shadow:var(--sombra);
  transform:translate(-50%,-14px) scale(.98);opacity:0;pointer-events:none;visibility:hidden;transition:transform .2s cubic-bezier(.2,.8,.25,1),opacity .16s}
body.hoja-on .velo{opacity:1;pointer-events:auto}
body.hoja-on .hoja{transform:translate(-50%,0);opacity:1;pointer-events:auto;visibility:visible}
.ft{width:100%;border:0;outline:0;background:none;font-family:var(--titulo);font-size:21px;font-weight:600;letter-spacing:-.02em;padding:6px 4px 12px}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chips button{flex:1;padding:9px 4px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--gris);background:var(--fondo)}
.chips button.on{background:var(--tinta);color:var(--fondo)}
.chips button.on[data-t=parcial]{background:var(--rojo);color:var(--sobre-rojo)}
.chips button.on[data-t=reunion]{background:var(--azul);color:var(--sobre-azul)}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.campos label,.campo{display:block;background:var(--fondo);border-radius:12px;padding:7px 10px 6px;font-size:11.5px;font-weight:600;color:var(--gris);min-width:0}
.campo{margin-bottom:8px}
.campos input,.campo input,.campo textarea{display:block;width:100%;min-width:0;border:0;outline:0;background:none;font-size:16px;font-weight:600;padding:2px 0 0;color:var(--tinta);
  color-scheme:light dark;-webkit-appearance:none;appearance:none;min-height:24px;text-align:left;resize:none}
.campo textarea{font-weight:500;line-height:1.4}
.ojo{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--rojo-s);color:var(--rojo);font-size:13.5px;font-weight:600}
.ojo.suave{background:var(--ambar-s);color:var(--ambar)}
.fn{display:block;width:100%;border:0;outline:0;resize:none;background:var(--fondo);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;margin-bottom:12px}
.acc{display:flex;gap:8px;align-items:center}
.btn{padding:12px 16px;border-radius:13px;font-size:14.5px;font-weight:700;background:var(--fondo);color:var(--tinta)}
.btn.pri{background:var(--azul);color:var(--sobre-azul);margin-left:auto;padding:12px 24px}
.btn.del{color:var(--rojo)}
.aj h2{font-family:var(--titulo);font-size:18px;font-weight:700;letter-spacing:-.02em;margin:20px 2px 4px}
.aj h2:first-child{margin-top:2px}
.aj p{margin:0 2px 10px;font-size:13.5px;color:var(--gris);line-height:1.5}
.aj .link{font-size:12.5px;word-break:break-all;background:var(--fondo);border-radius:12px;padding:10px 12px;margin-bottom:10px;color:var(--gris)}
.aj .fb{display:flex;flex-wrap:wrap;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);z-index:60;
  background:var(--tinta);color:var(--fondo);font-size:14px;font-weight:500;border-radius:14px;padding:11px 15px;opacity:0;transition:.2s;
  pointer-events:none;max-width:92vw;display:flex;align-items:center;gap:14px}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

@media(min-width:900px){
  .app{padding-left:24px;padding-right:24px}
  .cols{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start}
  .calbox{position:sticky;top:16px;padding:18px 14px 14px}
  .d{height:76px;padding-top:9px;gap:6px}
  .d .n{width:36px;height:36px;font-size:17px}
  .d .ms i{width:7px;height:7px}
  .d .tr{bottom:6px;height:6px}
  .barra h1{font-size:34px}
  .saludo{padding:20px 150px 22px 24px}
  .saludo .frase{font-size:23px;min-height:0}
  .saludo img{width:96px;right:26px}
  .hoja{top:11vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="barra">
    <h1 id="mesT"></h1>
    <button class="rb hoyb" id="mHoy" hidden>Hoy</button>
    <button class="rb" id="mAnt" aria-label="Mes anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <button class="rb" id="mSig" aria-label="Mes siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
    <button class="rb" id="bAj" aria-label="Ajustes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="conn" id="conn"></span></button>
  </header>
  <button class="saludo" id="saludo" aria-label="Cambiar la frase">
    <span class="hola" id="hola"></span>
    <span class="frase" id="frase"></span>
    <img src="icons/isotipo.png" alt="Cursemos Ingeniería" width="452" height="416">
  </button>
  <div class="cols">
    <section class="calbox" id="calbox" aria-label="Calendario">
      <div class="sem"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="mes" id="mes"></div>
    </section>
    <section class="lado" id="lado"></section>
  </div>
</div>

<button class="fab" id="fab" aria-label="Anotar algo nuevo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="velo" id="velo"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/red-config.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   AYUDAS
============================================================ */
const $=s=>document.querySelector(s);
const ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>ESC[c]);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sinAc=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const cap1=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const deYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const hoy=()=>ymd(new Date());
const masDias=(s,n)=>{const d=deYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dif=(a,b)=>Math.round((deYmd(a)-deYmd(b))/864e5);
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIA3=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const TIPOS={parcial:'Parcial',reunion:'Reunión',tarea:'Tarea',evento:'Otro'};
const PESO={parcial:0,reunion:1,evento:2,tarea:3};

function fmtDia(f){const d=deYmd(f);
  return DIA3[d.getDay()]+' '+d.getDate()+' '+MES3[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')}
function fmtLargo(f){const d=deYmd(f);
  return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' de '+d.getFullYear():'')}
const horas=i=>i.hora?(i.hora+(i.fin?' a '+i.fin:'')):'';

/* ============================================================
   ENTENDER LO QUE SE ESCRIBE: "Parcial de Física 2 el viernes 18hs"
============================================================ */
function entender(txt){
  let s=' '+String(txt).replace(/\s+/g,' ').trim()+' ';
  const h=hoy(),H=deYmd(h),F='(?=[\\s,.;:!?])';
  let fecha='',hora='',fin='',hasta='';
  const una=(re,fn)=>{s=s.replace(re,function(){return fn.apply(null,arguments)===false?arguments[0]:' '})};
  const armar=(d,m,y)=>{d=+d;m=+m;if(m<1||m>12||d<1||d>31)return false;
    const Y=y?(+y<100?2000+ +y:+y):H.getFullYear();
    let dt=new Date(Y,m-1,d);if(dt.getMonth()!==m-1)return false;
    if(!y&&dif(ymd(dt),h)<-30)dt=new Date(Y+1,m-1,d);
    fecha=ymd(dt)};
  const hm=(a,b)=>{a=+a;b=+(b||0);if(a>23||b>59)return'';return pad(a)+':'+pad(b)};

  s=s.replace(/ (a|por|de) la ma[ñn]ana(?=[\s,.;:!?])/gi,' $1 la \u0001');

  const nMes=m=>{let k=MES3.indexOf(sinAc(m).slice(0,3));return(k<0?8:k)+1};
  /* varios días: "del 23 al 27 de noviembre", "23/11 al 27/11", "del 28 al 2/12" */
  una(new RegExp(' (?:del |desde el )?(\\d{1,2})(?:/(\\d{1,2}))? (?:al|hasta el) (\\d{1,2})(?:/(\\d{1,2})| (?:de )?'+MES+')'+F,'i'),(m,d1,m1,d2,m2,mes)=>{
    const mf=m2?+m2:nMes(mes);let mi=m1?+m1:mf;if(!m1&&+d1>+d2)mi=mf===1?12:mf-1;
    if(armar(d2,mf)===false)return false;const b=fecha;fecha='';

    let a=fecha;if(a>b){const x=deYmd(a);x.setFullYear(x.getFullYear()-1);a=ymd(x)}

  if(!fecha)una(new RegExp(' (?:(?:para )?el )?(\\d{1,2})/(\\d{1,2})(?:/(\\d{2,4}))?'+F,'i'),(m,d,mo,y)=>armar(d,mo,y));
  if(!fecha)una(new RegExp(' (?:(?:para )?el )?(\\d{1,2}) (?:de )?(enero|ene|febrero|feb|marzo|mar|abril|abr|mayo|may|junio|jun|julio|jul|agosto|ago|septiembre|setiembre|sep|set|octubre|oct|noviembre|nov|diciembre|dic)(?: (?:de |del )?(\\d{4}))?'+F,'i'),
    (m,d,mes,y)=>{let k=MES3.indexOf(sinAc(mes).slice(0,3));if(k<0)k=8;return armar(d,k+1,y)});
  if(!fecha)una(new RegExp(' pasado ma[ñn]ana'+F,'i'),()=>{fecha=masDias(h,2)});
  if(!fecha)una(new RegExp(' (?:para )?ma[ñn]ana'+F,'i'),()=>{fecha=masDias(h,1)});
  if(!fecha)una(new RegExp(' (?:para )?hoy'+F,'i'),()=>{fecha=h});
  if(!fecha)una(new RegExp(' (?:para )?(?:el |este |esta )?(?:pr[oó]ximo )?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)(?: que viene| pr[oó]ximo)?'+F,'i'),
    (m,dia)=>{const k=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'].indexOf(sinAc(dia));

    (m,a,b,c,d)=>{const x=hm(a,b),y=hm(c,d);if(!x||!y)return false;hora=x;fin=y});
  if(!hora)una(new RegExp(' (?:a las? )?(\\d{1,2}):(\\d{2}) ?(?:hs|h)?'+F,'i'),(m,a,b)=>{hora=hm(a,b);if(!hora)return false});
  if(!hora)una(new RegExp(' (?:a las? )?(\\d{1,2})\\.(\\d{2}) ?(?:hs|h)'+F,'i'),(m,a,b)=>{hora=hm(a,b);if(!hora)return false});
  if(!hora)una(new RegExp(' (?:a las? )?(\\d{1,2}) ?(?:hs|h)'+F,'i'),(m,a)=>{hora=hm(a);if(!hora)return false});
  if(!hora)una(new RegExp(' a las? (\\d{1,2})'+F,'i'),(m,a)=>{hora=hm(a);if(!hora)return false});

  let titulo=s.replace(/\u0001/g,'mañana').replace(/\s+/g,' ').trim()
    .replace(/(?:[\s,;:]+(?:el|para|a|de|del|en))+$/i,'').replace(/^[\s,;:.\-]+|[\s,;:\-]+$/g,'');

  let tipo=hora?'evento':'tarea';
  if(/(^| )(parcial|parcialito|examen|recuperatorio|coloquio)( |$)/.test(ini)||/^final( |$)/.test(ini))tipo='parcial';
  else if(/(^| )(reunion|meet|llamada|videollamada)( |$)/.test(ini))tipo='reunion';
  if(hasta&&tipo==='tarea')tipo='evento';
  return{titulo,fecha,hora,fin,hasta,tipo};
}

const LS='mt-datos-v1';
let items={};
const leer=(k,def)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?def:v}catch(e){return def}};

const lista=()=>Object.keys(items).map(id=>items[id]);
const orden=(a,b)=>(a.fecha||'9').localeCompare(b.fecha||'9')||(a.hora||'').localeCompare(b.hora||'')
  ||PESO[a.tipo]-PESO[b.tipo]||(a.c||0)-(b.c||0);

const nube=(function(){
  const cfg=(typeof RED_FIREBASE_CONFIG!=='undefined'&&RED_FIREBASE_CONFIG&&RED_FIREBASE_CONFIG.databaseURL)?RED_FIREBASE_CONFIG:null;
  const raiz=(typeof RED_RAIZ!=='undefined'&&RED_RAIZ)||'tableros';
  const sucios=new Set(leer('mt-sucios',[])),borrados=new Set(leer('mt-borrados',[]));
  const anotar=()=>{try{localStorage.setItem('mt-sucios',JSON.stringify(Array.from(sucios)));
    localStorage.setItem('mt-borrados',JSON.stringify(Array.from(borrados)))}catch(e){}};
  const nueva=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',b=new Uint8Array(40);
    crypto.getRandomValues(b);return Array.from(b,x=>A[x%A.length]).join('')};
  let clave=localStorage.getItem('mt-clave')||'',ref=null,base=null,estado='local',alCambiar=()=>{},alEstado=()=>{},alPrefs=()=>{};
  let prefs=leer('mt-prefs',{})||{};

  const enLink=location.hash.match(/clave=([A-Za-z0-9]{32,})/);
  if(enLink&&enLink[1]!==clave){
    /* se abrió un link personal en un dispositivo que ya tenía cosas: se suman */
    Object.keys(items).forEach(id=>sucios.add(id));
    clave=enLink[1];localStorage.setItem('mt-clave',clave);anotar();
  }
  if(!clave&&cfg){clave=nueva();localStorage.setItem('mt-clave',clave)}
  if(clave){try{history.replaceState(null,'',location.pathname+location.search+'#clave='+clave)}catch(e){}}

  const pone=e=>{if(estado===e)return;estado=e;alEstado(e)};
  function subir(id){
    sucios.add(id);borrados.delete(id);anotar();
    if(!ref||!items[id])return;
    const u=items[id].u;
    ref.child(id).set(items[id]).then(()=>{if(items[id]&&items[id].u===u){sucios.delete(id);anotar()}}).catch(()=>{});
  }
  function quitar(id){
    sucios.delete(id);borrados.add(id);anotar();
    if(!ref)return;
    ref.child(id).remove().then(()=>{borrados.delete(id);anotar()}).catch(()=>{});
  }
  function entra(id,val){
    if(!val||borrados.has(id))return;
    const loc=items[id];
    if(loc&&(loc.u||0)>=(val.u||0))return;
    val.id=id;items[id]=val;sucios.delete(id);anotar();guardarLocal();alCambiar(id);
  }
  function sale(id){
    if(!items[id]||sucios.has(id))return;
    delete items[id];guardarLocal();alCambiar(id);
  }
  function conectar(){
    let cargados=0,cargado=false,enLinea=false;
    const listo=()=>{
      firebase.initializeApp(cfg);
      const db=firebase.database();
      base=db.ref(raiz+'/'+clave);ref=base.child('items');
      const negado=err=>{if(err&&/permission_denied/i.test(String(err.code||err))){ref=null;base=null;pone('negado')}};
      ref.on('child_added',s=>entra(s.key,s.val()),negado);
      ref.on('child_changed',s=>entra(s.key,s.val()));
      ref.on('child_removed',s=>sale(s.key));
      base.child('prefs').on('value',s=>{prefs=s.val()||{};try{localStorage.setItem('mt-prefs',JSON.stringify(prefs))}catch(e){}alPrefs()},()=>{});
      ref.once('value',s=>{
        if(!ref)return;
        cargado=true;if(enLinea)pone('ok');
        try{base.child('prefs/tz').set(Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Argentina/Buenos_Aires')}catch(e){}
        const rem=s.val()||{};
        borrados.forEach(id=>quitar(id));
        Object.keys(items).forEach(id=>{
          if(!rem[id]){if(sucios.has(id))subir(id);else{delete items[id];guardarLocal();alCambiar(id)}}
          else if(sucios.has(id)&&(items[id].u||0)>(rem[id].u||0))subir(id);
          else if(sucios.has(id)){sucios.delete(id);anotar()}
        });
      },()=>{}).catch(()=>{});
      db.ref('.info/connected').on('value',s=>{enLinea=!!s.val();if(estado!=='negado')pone(enLinea&&cargado?'ok':'off')});
    };
    const tag=src=>{const e=document.createElement('script');e.src=src;
      e.onload=()=>{if(++cargados===2)listo()};e.onerror=()=>pone('off');document.head.appendChild(e)};
    tag('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
    tag('https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js');
  }
  return{
    get estado(){return estado},get clave(){return clave},hay:!!cfg,
    link:()=>clave?location.origin+location.pathname+'#clave='+clave:'',
    subir,quitar,
    guardar:(ruta,v)=>base?base.child(ruta).set(v):Promise.reject(new Error('sin nube')),
    quitarRuta:ruta=>base?base.child(ruta).remove():Promise.resolve(),
    adoptar(texto){
      const t=String(texto||'').trim(),m=t.match(/clave=([A-Za-z0-9]{32,})/)||t.match(/^([A-Za-z0-9]{32,})$/);
      if(!m)return false;
      if(m[1]!==clave){Object.keys(items).forEach(id=>sucios.add(id));anotar();
        localStorage.setItem('mt-clave',m[1]);location.hash='clave='+m[1];location.reload()}
      return true;
    },
    get prefs(){return prefs},
    pref(k,v){if(v==null||v===''||(Array.isArray(v)&&!v.length)){delete prefs[k];v=null}else prefs[k]=v;
      try{localStorage.setItem('mt-prefs',JSON.stringify(prefs))}catch(e){}
      if(base)base.child('prefs/'+k).set(v).catch(()=>{})},
    iniciar(fnCambio,fnEstado,fnPrefs){alCambiar=fnCambio;alEstado=fnEstado;alPrefs=fnPrefs||alPrefs;if(cfg&&clave){pone('off');conectar()}},
    cambiarLink(){
      const fin=()=>{Object.keys(items).forEach(id=>sucios.add(id));anotar();
        localStorage.setItem('mt-clave',nueva());localStorage.removeItem('mt-push');location.hash='';location.reload()};
      if(ref)ref.parent.remove().then(fin,fin);else fin();
    }
  };
})();

/* ============================================================
   TIEMPOS, VARIOS DÍAS Y CHOQUES
============================================================ */
const minutos=t=>{const p=t.split(':');return +p[0]*60+ +p[1]};
const ultimo=i=>i.hasta&&i.hasta>i.fecha?i.hasta:i.fecha;          /* último día de algo */
const largo=i=>!!(i.fecha&&i.hasta&&i.hasta>i.fecha);              /* dura más de un día */
const cae=(i,f)=>!!i.fecha&&i.fecha<=f&&f<=ultimo(i);              /* ese día está adentro */
function cuandoTxt(i){
  if(!i.fecha)return'Sin fecha';
  if(!largo(i))return fmtDia(i.fecha)+(i.hora?', '+horas(i):'');
  const a=deYmd(i.fecha),b=deYmd(i.hasta),mismo=a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear();
  return(mismo?DIA3[a.getDay()]+' '+a.getDate():fmtDia(i.fecha))+' al '+fmtDia(i.hasta);
}
function rango(i){
  if(!i.hora)return null;
  const a=minutos(i.hora);let b=i.fin?minutos(i.fin):a+(i.tipo==='parcial'?120:60);
  if(b<=a)b=a+60;
  return[a,b];
}
function cuando(i){const d=deYmd(i.fecha);if(i.hora){const p=i.hora.split(':');d.setHours(+p[0],+p[1],0,0)}return d}
function yaPaso(i){
  if(!i.fecha)return false;
  const dd=dif(ultimo(i),hoy());
  if(dd<0)return true;
  if(dd>0||!i.hora||largo(i))return false;
  const r=rango(i),n=new Date();
  return n.getHours()*60+n.getMinutes()>=r[1];
}
function sePisan(a,b){
  if(a.tipo==='parcial'&&b.tipo==='parcial')return true;
  if(a.tipo==='tarea'||b.tipo==='tarea'||largo(a)||largo(b))return false;
  const x=rango(a),y=rango(b);
  return!!(x&&y&&x[0]<y[1]&&y[0]<x[1]);
}
function analizar(extra){
  const act=lista().filter(i=>i.fecha&&!i.hecho&&!(extra&&i.id===extra.id));
  if(extra&&extra.fecha)act.push(extra);
  const porDia={},pisa={},cerca={},dias={};
  act.forEach(i=>(porDia[i.fecha]=porDia[i.fecha]||[]).push(i));
  Object.keys(porDia).forEach(f=>{const a=porDia[f];
    for(let x=0;x<a.length;x++)for(let y=x+1;y<a.length;y++)if(sePisan(a[x],a[y])){
      (pisa[a[x].id]=pisa[a[x].id]||[]).push(a[y]);(pisa[a[y].id]=pisa[a[y].id]||[]).push(a[x]);
      (dias[f]=dias[f]||new Set()).add(a[x].id).add(a[y].id)}});
  const ps=act.filter(i=>i.tipo==='parcial').sort(orden);
  for(let k=0;k<ps.length;k++)for(let j=k+1;j<ps.length&&dif(ps[j].fecha,ps[k].fecha)<=1;j++)if(dif(ps[j].fecha,ps[k].fecha)===1){
    (cerca[ps[k].id]=cerca[ps[k].id]||[]).push({i:ps[j],t:'Al otro día'});
    (cerca[ps[j].id]=cerca[ps[j].id]||[]).push({i:ps[k],t:'El día antes'})}
  /* un parcial que cae en medio de algo de varios días */
  const largos=act.filter(i=>largo(i)&&i.tipo!=='tarea');
  ps.forEach(p=>largos.forEach(e=>{if(e.id!==p.id&&cae(e,p.fecha))(cerca[p.id]=cerca[p.id]||[]).push({i:e,t:'Cae durante'})}));
  return{pisa,cerca,dias};
}
/* lo que falta, para la fila: número grande + unidad */
function falta(i){
  const h=hoy(),dd=dif(i.fecha,h);
  if(dd<=0&&largo(i)&&dif(i.hasta,h)>=0){const q=dif(i.hasta,h);return{n:'hoy',u:q===0?'último día':'quedan '+(q+1)+' días'}}
  if(dd<0)return i.tipo==='tarea'&&!i.hecho?{n:-dd,u:dd===-1?'día tarde':'días tarde',tarde:1}:{n:-dd,u:dd===-1?'día atrás':'días atrás',ido:1};
  if(dd>0)return{n:dd,u:dd===1?'día':'días'};
  if(!i.hora)return{n:'hoy',u:''};
  const min=Math.ceil((cuando(i)-Date.now())/6e4);
  if(min<=0)return yaPaso(i)?{n:'hoy',u:'ya pasó',ido:1}:{n:'ya',u:'ahora'};
  return min<60?{n:min,u:'min'}:{n:Math.floor(min/60),u:Math.floor(min/60)===1?'hora':'horas'};
}
/* lo que falta, en vivo, para lo próximo */
function enVivo(i){
  const dd=dif(i.fecha,hoy());
  if(dd<=0&&largo(i))return'En curso';
  if(!i.hora)return dd===0?'Hoy':dd===1?'Mañana':'Faltan '+dd+' días';
  const s=Math.floor((cuando(i)-Date.now())/1000);
  if(s<=0)return'Ahora';
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  return d>0?d+' d '+pad(h)+' h '+pad(m)+' min':h>0?h+' h '+pad(m)+' min '+pad(x)+' s':m+' min '+pad(x)+' s';
}
const juntos=c=>{const g={};c.forEach(x=>(g[x.t]=g[x.t]||[]).push(x.i.titulo));return Object.keys(g).map(t=>t+': '+g[t].join(' y ')).join('. ')};
const elDia=f=>{const n=dif(f,hoy());return n===0?'hoy':n===1?'mañana':n<7?'el '+DIAS[deYmd(f).getDay()]:'el '+fmtDia(f)};

function renderCal(dir){
  const p=calMes.split('-').map(Number),uno=new Date(p[0],p[1]-1,1),h=hoy(),A=analizar();
  const corr=(uno.getDay()+6)%7,dm=new Date(p[0],p[1],0).getDate(),filas=Math.ceil((corr+dm)/7),ini=masDias(ymd(uno),-corr);
  const vis=lista().filter(i=>i.fecha&&!(i.tipo==='tarea'&&i.hecho)),sueltos={},largos=vis.filter(largo);
  vis.forEach(i=>{if(!largo(i))(sueltos[i.fecha]=sueltos[i.fecha]||[]).push(i)});
  const tramo=f=>largos.some(i=>cae(i,f));
  let out='';
  for(let k=0;k<filas*7;k++){
    const f=masDias(ini,k),its=(sueltos[f]||[]).sort(orden),ch=A.dias[f]&&f>=h,tr=tramo(f),dur=largos.filter(i=>cae(i,f));
    out+='<button class="d'+(f.slice(0,7)!==calMes?' fuera':'')+(f===h?' hoy':'')+(f===sel?' sel':'')
      +(its.some(i=>i.tipo==='parcial')?' p':'')+(ch?' choque':'')+'" data-dia="'+f+'" aria-label="'
      +esc(fmtLargo(f)+(its.length||dur.length?': '+its.concat(dur).map(i=>i.titulo).join(', '):'')+(ch?'. Se te juntan cosas':''))
      +'"'+(f===sel?' aria-pressed="true"':'')+'><span class="n">'+ +f.slice(8)+'</span><span class="ms">'
      +its.slice(0,4).map(i=>'<i class="m-'+i.tipo+'"></i>').join('')+'</span>'
      +(tr?'<span class="tr'+(tramo(masDias(f,-1))?'':' ini')+(tramo(masDias(f,1))?'':' fin')+'"></span>':'')+'</button>';
  }
  const m=$('#mes');m.innerHTML=out;
  if(dir){m.classList.remove('e-der','e-izq');void m.offsetWidth;m.classList.add(dir>0?'e-der':'e-izq')}
  $('#mesT').innerHTML='<b>'+MESES[p[1]-1]+'</b>'+(p[0]!==+h.slice(0,4)?' <span>'+p[0]+'</span>':'');
  $('#mHoy').hidden=calMes===h.slice(0,7)&&!sel;
}

function fila(i,A,enDia){
  const f=i.fecha?falta(i):null,pisa=!i.hecho&&A.pisa[i.id],cerca=!i.hecho&&A.cerca[i.id];
  return'<div class="it t-'+i.tipo+(f&&f.tarde?' tarde':'')+(i.hecho||(f&&f.ido)?' ido':'')+'" data-abrir="'+i.id+'" role="button" tabindex="0">'
    +'<span class="cu">'+(f?'<b'+(isNaN(f.n)?' class="w"':'')+'>'+f.n+'</b>'+(f.u?'<small>'+f.u+'</small>':''):'')+'</span>'
    +'<span class="tx"><b>'+esc(i.titulo||'Sin título')+'</b>'
    +'<small>'+esc(enDia&&!largo(i)?(i.hora?horas(i):i.tipo==='evento'?'Todo el día':TIPOS[i.tipo]):i.fecha?cuandoTxt(i):i.tipo==='evento'?'Para cuando se pueda':TIPOS[i.tipo])+'</small>'
    +(pisa?'<em>Se pisa con '+esc(pisa.map(x=>x.titulo).join(' y '))+'</em>':cerca?'<em class="ce">'+esc(juntos(cerca))+'</em>':'')+'</span>'
    +(i.tipo==='tarea'?'<button class="chk'+(i.hecho?' on':'')+'" data-tildar="'+i.id+'" aria-label="'+(i.hecho?'Marcar como pendiente':'Marcar como hecha')+'"></button>':'')
    +'</div>';
}
const ICO='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.3"/></svg>';

function renderLado(){
  const h=hoy(),A=analizar(),todos=lista();let out='';heroId=null;
  if(sel){
    const del=todos.filter(i=>cae(i,sel)).sort(orden),n=dif(sel,h);
    out+='<div class="cabl"><h2>'+fmtLargo(sel)+'</h2><small>'+(n===0?'hoy':n===1?'mañana':n>0?'en '+n+' días':'hace '+(-n)+(n===-1?' día':' días'))+'</small><button data-todo>Ver todo</button></div>'
      +'<div class="lista">'+del.map(i=>fila(i,A,1)).join('')
      +(del.length?'':'<div class="vacio">Día libre. No hay nada anotado.</div>')
      +'<button class="mas" data-nuevo>Anotar algo este día</button></div>';
  }else{
    Object.keys(A.dias).filter(f=>f>=h).sort().slice(0,2).forEach(f=>{
      out+='<button class="aviso" data-dia="'+f+'">'+ICO+'<span><b>Se te juntan '+A.dias[f].size+' cosas</b> '+esc(elDia(f))+'</span></button>'});
    const tarde=todos.filter(i=>i.tipo==='tarea'&&!i.hecho&&i.fecha&&ultimo(i)<h).sort(orden);
    const prox=todos.filter(i=>i.fecha&&ultimo(i)>=h&&!i.hecho).sort(orden);
    const sinF=todos.filter(i=>!i.fecha&&!i.hecho).sort((a,b)=>(a.c||0)-(b.c||0));
    const vivos=prox.filter(i=>!yaPaso(i));
    const hero=vivos.find(i=>i.tipo==='parcial')||vivos.find(i=>i.tipo!=='tarea')||null;
    if(hero){
      heroId=hero.id;const pisa=A.pisa[hero.id],cerca=A.cerca[hero.id],esP=hero.tipo==='parcial';
      out+='<button class="hero t-'+hero.tipo+'" data-abrir="'+hero.id+'"><span class="ht">'+esc(hero.titulo||'Sin título')+'</span>'
        +'<span class="hc" id="heroC">'+enVivo(hero)+'</span><span class="hq">'+esc(largo(hero)?cuandoTxt(hero):fmtLargo(hero.fecha)+(hero.hora?', '+horas(hero):''))+'</span>'
        +(esP?'<span class="hm">'+esc(FR.app_hero_parcial[(diaN()+hero.titulo.length)%FR.app_hero_parcial.length])+'</span>':'')
        +(pisa?'<span class="hx">Se pisa con '+esc(pisa.map(x=>x.titulo).join(' y '))+'</span>':cerca?'<span class="hx">'+esc(juntos(cerca))+'</span>':'')+'</button>';
    }
    const resto=tarde.concat(prox.filter(i=>i!==hero));
    if(resto.length||sinF.length){
      out+='<div class="cabl"><h2>'+(hero?'Después':'Lo que viene')+'</h2></div><div class="lista">'+resto.map(i=>fila(i,A)).join('')
        +(sinF.length?(resto.length?'<div class="sep">Sin fecha</div>':'')+sinF.map(i=>fila(i,A)).join(''):'')+'</div>';
    }else if(!hero){
      const algo=todos.length>0;
      out+='<div class="lista"><div class="vacio"><b>'+(algo?esc(completar(FR.app_despejado[diaN()%FR.app_despejado.length],{n:nombre()})):'Empecemos')+'</b>'
        +(algo?'Cuando aparezca algo nuevo, tocá el + y anotalo.':'Tocá el + y escribí lo que tengas, por ejemplo: Parcial de Física 2 el viernes 18hs.')+'</div></div>';
    }
  }
  $('#lado').innerHTML=out;
}
setInterval(()=>{const c=$('#heroC');if(c&&heroId&&items[heroId]){const t=enVivo(items[heroId]);if(c.textContent!==t)c.textContent=t}},1000);
let diaVisto=hoy();
setInterval(()=>{if(hoy()!==diaVisto){diaVisto=hoy();if(calMes<diaVisto.slice(0,7)&&!sel)calMes=diaVisto.slice(0,7);render()}else renderLado();pintarSaludo()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){vuelta++;pintarSaludo(true);render()}});

function mover(n){
  if(n===0){calMes=hoy().slice(0,7);sel=null;render();scrollTo({top:0,behavior:'smooth'});return}
  const p=calMes.split('-').map(Number);calMes=ymd(new Date(p[0],p[1]-1+n,1)).slice(0,7);render(n);
}

let form=null;
function abrirHoja(html,etiqueta){const h=$('#hoja');h.innerHTML=html;h.setAttribute('aria-label',etiqueta);h.scrollTop=0;document.body.classList.add('hoja-on')}
function cerrarHoja(){document.body.classList.remove('hoja-on');form=null;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}

function abrirForm(id){
  const i=id?items[id]:null;if(id&&!i)return;
  const b=i||{tipo:'tarea',titulo:'',fecha:sel||'',hasta:'',hora:'',fin:'',notas:''};
  form={id:id||null,tipo:b.tipo,man:{}};
  abrirHoja('<form id="hf" autocomplete="off">'
    +'<input class="ft" id="fT" type="text" enterkeyhint="done" value="'+esc(b.titulo)+'" placeholder="'+(i?'¿Qué es?':'Parcial de Física 2 el viernes 18hs')+'" aria-label="Qué es">'
    +'<div class="chips" id="fTipo" role="group" aria-label="Tipo">'+Object.keys(TIPOS).map(t=>'<button type="button" data-t="'+t+'">'+TIPOS[t]+'</button>').join('')+'</div>'
    +'<div class="campos"><label>Día<input type="date" id="fF" value="'+esc(b.fecha)+'"></label>'
    +'<label>Termina (si dura varios días)<input type="date" id="fFh" value="'+esc(largo(b)?b.hasta:'')+'"></label>'
    +'<label>Desde<input type="time" id="fH" value="'+esc(b.hora)+'"></label><label>Hasta<input type="time" id="fHf" value="'+esc(b.fin)+'"></label></div>'
    +'<p class="ojo" id="fOjo" hidden></p>'
    +'<textarea class="fn" id="fN" rows="1" placeholder="Nota">'+esc(b.notas)+'</textarea>'
    +'<div class="acc">'+(i?'<button type="button" class="btn del" id="fDel">Borrar</button>'
      +(i.tipo==='tarea'?'<button type="button" class="btn" id="fHecha">'+(i.hecho?'Volver a pendiente':'Marcar hecha')+'</button>':''):'<button type="button" class="btn" id="fCan">Cancelar</button>')
    +'<button type="submit" class="btn pri">'+(i?'Guardar':'Anotar')+'</button></div></form>',i?'Editar':'Anotar');
  const T=$('#fT'),F=$('#fF'),FH=$('#fFh'),H=$('#fH'),HF=$('#fHf'),N=$('#fN');
  const chips=()=>$('#fTipo').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.t===form.tipo));
  const ojo=()=>{
    const o=$('#fOjo'),tmp={id:form.id||'_nuevo',tipo:form.tipo,fecha:F.value,hasta:FH.value,hora:H.value,fin:H.value?HF.value:'',titulo:''};
    if(!tmp.fecha){o.hidden=true;return}
    if(FH.value&&FH.value<F.value){o.hidden=false;o.classList.add('suave');o.textContent='Termina antes de empezar: revisá las fechas.';return}
    const A=analizar(tmp),p=A.pisa[tmp.id],c=A.cerca[tmp.id];
    o.hidden=!(p||c);o.classList.toggle('suave',!p);
    if(p)o.textContent='Ojo, se pisa con '+p.map(x=>x.titulo+(x.hora?' ('+x.hora+')':'')).join(' y ')+'.';
    else if(c)o.textContent=juntos(c)+'.';
  };
  chips();ojo();
  if(!i)T.oninput=()=>{const e=entender(T.value);
    if(!form.man.tipo&&T.value.trim()){form.tipo=e.tipo;chips()}
    if(!form.man.fecha){F.value=e.fecha||sel||'';FH.value=e.hasta||''}
    if(!form.man.hora){H.value=e.hora;HF.value=e.fin}
    ojo()};
  $('#fTipo').onclick=e=>{const x=e.target.closest('[data-t]');if(!x)return;form.tipo=x.dataset.t;form.man.tipo=1;chips();ojo()};
  F.onchange=()=>{form.man.fecha=1;ojo()};
  FH.onchange=()=>{form.man.fecha=1;if(FH.value&&!F.value)F.value=FH.value;ojo()};
  H.onchange=()=>{form.man.hora=1;ojo()};
  HF.onchange=()=>{form.man.hora=1;ojo()};
  N.oninput=()=>{N.style.height='auto';N.style.height=N.scrollHeight+'px'};N.oninput();
  $('#hf').onsubmit=e=>{e.preventDefault();guardarForm()};
  if(i){$('#fDel').onclick=()=>{cerrarHoja();borrar(id)};
    const hb=$('#fHecha');if(hb)hb.onclick=e=>{const r=e.target.getBoundingClientRect();cerrarHoja();tildar(id,{x:r.left+r.width/2,y:r.top})}}
  else{$('#fCan').onclick=cerrarHoja;T.focus()}
}
function guardarForm(){
  const v=$('#fT').value.trim();if(!v){$('#fT').focus();return}
  const d={tipo:form.tipo,fecha:$('#fF').value,hasta:$('#fFh').value,hora:$('#fH').value,fin:$('#fHf').value,notas:$('#fN').value.trim()};
  if(!d.hora)d.fin='';
  if(!d.fecha||!d.hasta||d.hasta<=d.fecha)d.hasta='';
  if(form.id){
    const i=items[form.id];if(!i){cerrarHoja();return}
    Object.assign(i,d,{titulo:v});if(i.tipo!=='tarea'){i.hecho=false;i.ht=0}
    poner(form.id);cerrarHoja();
  }else{
    d.titulo=entender(v).titulo||cap1(v);
    const id=crear(d),A=analizar(),p=A.pisa[id];
    if(d.fecha&&d.fecha.slice(0,7)!==calMes&&!sel)calMes=d.fecha.slice(0,7);
    cerrarHoja();
    if(p)toast('Anotado. Se pisa con '+p[0].titulo,'Ver',()=>{sel=d.fecha;calMes=d.fecha.slice(0,7);render()});
    else toast('Anotado'+(d.fecha?' para '+elDia(d.fecha):''));
  }
}

let instalar=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalar=e});
const esIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const instalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
/* En iPhone la app instalada tiene que arrancar desde la dirección abierta, que lleva la clave */
if(esIOS){const m=$('#manif');if(m)m.href='manifest-ios.webmanifest'}

/* ---------- avisos al teléfono ---------- */
const AV_PUB=(typeof AVISOS_CLAVE_PUBLICA!=='undefined'&&AVISOS_CLAVE_PUBLICA)||'';
const aBytes=s=>{const p=s.replace(/-/g,'+').replace(/_/g,'/'),r=atob(p+'==='.slice((p.length+3)%4));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const idDe=async e=>{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(e));return Array.from(new Uint8Array(h).slice(0,12),b=>b.toString(16).padStart(2,'0')).join('')};
const queDisp=()=>esIOS?'iPhone':/Android/.test(navigator.userAgent)?'Android':'Compu';
async function estadoAvisos(){
  if(!AV_PUB)return'no';
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return esIOS&&!instalada()?'instalar':'no';
  if(Notification.permission==='denied')return'bloqueado';
  if(nube.estado!=='ok')return'sin-nube';
  const reg=await navigator.serviceWorker.getRegistration(),sub=reg&&await reg.pushManager.getSubscription();
  return sub&&Notification.permission==='granted'&&localStorage.getItem('mt-push')?'activo':'listo';
}
async function anotarSuscripcion(sub){
  const j=sub.toJSON(),id=await idDe(j.endpoint);
  await nube.guardar('push/'+id,{endpoint:j.endpoint,keys:j.keys,t:Date.now(),d:queDisp()});
  localStorage.setItem('mt-push',id);
}
async function activarAvisos(){
  try{
    const b=$('#avSi');if(b){b.disabled=true;b.textContent='Activando…'}
    if(await Notification.requestPermission()!=='granted'){toast('Sin tu permiso no puedo mandarte avisos');return pintarAvisos()}
    const tope=new Promise((_,no)=>setTimeout(()=>no(new Error('tardó demasiado')),20000));
    await Promise.race([tope,(async()=>{
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:aBytes(AV_PUB)});
      await anotarSuscripcion(sub);
    })()]);
    const reg=await navigator.serviceWorker.ready,n=nombre();
    reg.showNotification(n?'Listo, '+n+' 🙌':'Listo 🙌',{body:'Te voy a escribir dos veces por día, a la mañana y a la noche.',icon:'icons/ci-192.png',tag:'activados'}).catch(()=>{});
    toast('Avisos activados');
  }catch(e){toast('No se pudieron activar los avisos. Probá de nuevo en un rato.')}
  pintarAvisos();informarEstado();
}
async function desactivarAvisos(){
  try{
    const reg=await navigator.serviceWorker.getRegistration(),sub=reg&&await reg.pushManager.getSubscription();
    const id=localStorage.getItem('mt-push');localStorage.removeItem('mt-push');
    if(sub)await sub.unsubscribe();
    if(id)await nube.quitarRuta('push/'+id);
    toast('Avisos desactivados en este dispositivo');
  }catch(e){toast('No se pudieron desactivar')}
  pintarAvisos();informarEstado();
}
/* estado de los avisos de este dispositivo, para poder revisarlo si no llegan */
async function informarEstado(){
  try{
    let d=localStorage.getItem('mt-disp');if(!d){d=uid();localStorage.setItem('mt-disp',d)}
    await nube.guardar('estado/'+d,{d:queDisp(),avisos:await estadoAvisos().catch(()=>'error'),
      permiso:'Notification' in window?Notification.permission:'sin soporte',instalada:instalada(),
      push:'PushManager' in window,sw:'serviceWorker' in navigator,t:Date.now()});
  }catch(e){}
}
/* Si este dispositivo ya dio permiso y sigue suscripto, se anota en el tablero que esté usando */
async function refrescarAviso(){
  try{
    if(AV_PUB&&'Notification' in window&&'serviceWorker' in navigator&&Notification.permission==='granted'){
      const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
      if(sub)await anotarSuscripcion(sub);else localStorage.removeItem('mt-push');
    }
  }catch(e){}
  informarEstado();
}
async function pintarAvisos(){
  if(!$('#aAv'))return;
  let e;try{e=await estadoAvisos()}catch(x){e='no'}
  const c=$('#aAv');if(!c)return;
  const QUE='Dos mensajes por día, a la mañana y a la noche: ánimo, lo que tenés anotado y cuánto falta para tu próximo parcial.';
  c.innerHTML={
    activo:'<p>Activados en este dispositivo. '+QUE+'</p><div class="fb"><button class="btn" id="avNo">Desactivar</button></div>',
    listo:'<p>'+QUE+'</p><div class="fb"><button class="btn pri" id="avSi" style="margin:0 0 6px">Activar avisos</button></div>',
    instalar:'<p>En iPhone los avisos funcionan con la app instalada: tocá Compartir, “Agregar a inicio”, abrila desde el ícono y activalos ahí.</p>',
    bloqueado:'<p>Los avisos están bloqueados para esta app. Se habilitan desde los ajustes del teléfono o del navegador.</p>',
    'sin-nube':'<p>Los avisos necesitan la sincronización, que ahora no está conectada. Probá de nuevo cuando haya conexión.</p>',
    no:'<p>Este navegador no permite avisos.</p>'}[e];
  const si=$('#avSi'),no=$('#avNo');
  if(si)si.onclick=activarAvisos;
  if(no)no.onclick=desactivarAvisos;
}

  const bi=$('#aInst');if(bi)bi.onclick=()=>{instalar.prompt();instalar=null;cerrarHoja()};
  const c=$('#aCop');
  if(c)c.onclick=()=>{const l=nube.link();(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Link copiado'),()=>prompt('Copiá tu link:',l))};
  const r=$('#aRot');
  if(r)r.onclick=()=>{if(confirm('Se crea un link nuevo y el anterior deja de funcionar en todos los dispositivos. Después vas a tener que abrir el link nuevo en cada uno, y los avisos dejan de llegar hasta configurarlos de nuevo. ¿Cambiarlo?'))nube.cambiarLink()};
  const o=$('#aOtro');
  if(o)o.onclick=()=>{const v=prompt('Pegá acá el link personal de tu otro dispositivo. Lo que tengas anotado en este se suma.');if(v&&!nube.adoptar(v))toast('Ese link no tiene una clave válida')};
  pintarAvisos();
  $('#aExp').onclick=()=>{const b=new Blob([JSON.stringify({exportado:new Date().toISOString(),items},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mi-tablero-'+hoy()+'.json';a.click();toast('Copia descargada')};
  $('#aImp').onclick=()=>$('#aFile').click();
  $('#aFile').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result),src=d.items||d;let k=0;
        Object.keys(src).forEach(id=>{const v=src[id];if(!v||typeof v!=='object'||!TIPOS[v.tipo])return;
          v.id=id;if(!items[id]||(v.u||0)>=(items[id].u||0)){items[id]=v;nube.subir(id);k++}});
        guardarLocal();pintar();cerrarHoja();toast(k?('Se restauraron '+k+(k===1?' cosa':' cosas')):'Esa copia no tiene nada nuevo');
      }catch(err){toast('Ese archivo no es una copia de este tablero')}};
    rd.readAsText(f)};
}

/* ============================================================
   AVISOS EN PANTALLA + EVENTOS
============================================================ */
let tT;
function toast(msg,accion,fn){
  const t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(accion?'<button>'+esc(accion)+'</button>':'');
  if(accion)t.querySelector('button').onclick=()=>{t.classList.remove('show');fn()};
  t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),accion?6000:2200);
}
function ponerEstado(e){
  const c=$('#conn');c.className='conn '+e;
  $('#bAj').title={ok:'Sincronizado',off:'Sin conexión',negado:'Guardado en este dispositivo',local:'Guardado en este dispositivo'}[e]||'';
  if(e==='ok')refrescarAviso();
  pintarAvisos();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tildar],[data-abrir],[data-dia],[data-todo],[data-nuevo]');
  if(!t)return;
  const d=t.dataset;
  if(d.tildar){e.stopPropagation();tildar(d.tildar,{x:e.clientX,y:e.clientY})}
  else if(d.abrir)abrirForm(d.abrir);
  else if(d.dia){
    const otro=d.dia.slice(0,7)!==calMes,dir=d.dia.slice(0,7)>calMes?1:-1;
    sel=(sel===d.dia&&!t.classList.contains('aviso'))?null:d.dia;
    if(otro){calMes=d.dia.slice(0,7);render(dir)}else render();
    if(t.classList.contains('aviso'))scrollTo({top:0,behavior:'smooth'});
  }
  else if('todo' in d){sel=null;render()}
  else if('nuevo' in d)abrirForm();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.body.classList.contains('hoja-on'))cerrarHoja();else if(sel){sel=null;render()}return}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.it')){abrirForm(e.target.dataset.abrir);return}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey||document.body.classList.contains('hoja-on'))return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();abrirForm()}
  else if(e.key==='ArrowLeft')mover(-1);
  else if(e.key==='ArrowRight')mover(1);
});
$('#fab').onclick=()=>abrirForm();
$('#velo').onclick=cerrarHoja;
$('#mAnt').onclick=()=>mover(-1);
$('#mSig').onclick=()=>mover(1);
$('#mHoy').onclick=()=>mover(0);
$('#bAj').onclick=abrirAjustes;
$('#saludo').onclick=()=>{vuelta++;pintarSaludo(true)};
/* deslizar el calendario para cambiar de mes */
(function(){let x0=0,y0=0,ok=false;const c=$('#calbox');
  c.addEventListener('touchstart',e=>{if(e.touches.length!==1){ok=false;return}ok=true;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  c.addEventListener('touchend',e=>{if(!ok)return;ok=false;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.6)mover(dx<0?1:-1)},{passive:true});
})();

nube.iniciar(()=>pintar(),ponerEstado,()=>{pintarSaludo();renderLado()});
ponerEstado(nube.estado);
pintarSaludo();
render();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__tablero={entender,analizar};
})();
</script>
