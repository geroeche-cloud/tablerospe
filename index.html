<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<title>SPE · Organización</title>
<meta name="description" content="Organización del SPE Student Chapter: qué hay que hacer, quién lo hace, qué falta y qué está bloqueado.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231B5CFF'/><circle cx='16' cy='16' r='5' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --panel:#ffffff; --ink:#0F172A; --muted:#64748B; --faint:#94A3B8;
  --line:#E2E8F0; --line2:#CBD5E1; --accent:#1B5CFF; --accent-soft:#EBF0FF;
  --red:#DC2626; --red-soft:#FEF2F2; --amber:#D97706; --amber-soft:#FEF6E7; --green:#16A34A; --green-soft:#EFFAF1;
  --k-actividad:#1B5CFF; --k-tarea:#475569; --k-idea:#D97706;
  --k-persona:#0D9488; --k-empresa:#4F46E5; --k-nota:#94A3B8;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.07);
  --shadow-lg:0 8px 32px rgba(15,23,42,.16);
  --top:56px; --panelw:392px; --tabs:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
::placeholder{color:var(--faint)}

/* ---------- barra superior ---------- */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:60;display:flex;align-items:center;gap:12px;
  padding:0 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand span{font-size:12.5px;color:var(--muted);font-weight:500}
.brand i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);align-self:center}
.viewtog{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
.viewtog button{padding:5px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.viewtog button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.gsearch{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--muted)}
.gsearch input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px;color:var(--ink)}
.topnav{display:flex;gap:4px;margin-left:auto}
.topnav button{padding:8px 13px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);position:relative}
.topnav button:hover{background:var(--bg);color:var(--ink)}
.topnav button.on{background:var(--accent-soft);color:var(--accent)}
.badge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:17px;text-align:center}
.badge.zero{display:none}

/* ============================================================
   TABLERO
============================================================ */
#tablero{position:fixed;inset:var(--top) 0 var(--tabs) 0;overflow-y:auto;overscroll-behavior:contain;
  padding:22px 20px 120px;transition:padding-right .22s cubic-bezier(.2,.8,.25,1)}
@media(min-width:861px){body.panel-open #tablero{padding-right:calc(var(--panelw) + 20px)}}
.board{max-width:680px;margin:0 auto}
.hoy{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.hoy h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.hoy .fecha{font-size:13px;color:var(--faint);font-weight:500}
.hoy .gente{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);padding:6px 11px;border-radius:8px}
.hoy .gente:hover{background:#fff;color:var(--ink)}
.stats{display:flex;gap:8px;margin:12px 0 6px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:11px;background:var(--panel);
  border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.stat b{font-size:17px;font-weight:800;color:var(--ink)}
.stat .led{width:9px;height:9px;border-radius:50%}
.stat.rojo:hover{border-color:var(--red);cursor:pointer}
.stat.rojo b{color:var(--red)}
.bsec{margin-top:22px}
.bsec>h2{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bsec>h2 .led{width:9px;height:9px;border-radius:50%}
.bsec>h2 .n{color:var(--faint);font-weight:600}
.bsec>h2 button{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600;text-transform:none;letter-spacing:0}
.bsec>h2 button:hover{color:var(--accent)}

/* fila de tarea del tablero */
.brow{display:flex;align-items:center;gap:11px;width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-bottom:7px;cursor:pointer;text-align:left;transition:box-shadow .12s}
.brow:hover{box-shadow:var(--shadow)}
.brow .bst{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;border:0;cursor:pointer}
.brow .bst i{width:10px;height:10px;border-radius:50%;display:block;pointer-events:none}
.brow .bst:hover{background:var(--bg)}
.brow .bt{flex:1;min-width:0}
.brow .bt b{display:block;font-size:14.5px;font-weight:600;line-height:1.3;word-break:break-word}
.brow.done .bt b{color:var(--faint);text-decoration:line-through}
.brow .bt small{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:2px}
.brow .bt small .ctx{color:var(--accent);font-weight:600}
.brow .bt small .blk{color:var(--amber);font-weight:600}
.brow .bt small .ven{color:var(--red);font-weight:600}
.brow .who{flex:none;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--bg);
  border-radius:999px;padding:4px 11px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .asg{flex:none;font-size:12.5px;font-weight:700;color:var(--red);background:var(--red-soft);
  border-radius:999px;padding:4px 11px}
.brow .asg:hover{background:var(--red);color:#fff}

/* fila de actividad del tablero */
.arow{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--k-actividad);
  border-radius:12px;padding:12px 14px;margin-bottom:7px;cursor:pointer;text-align:left;transition:box-shadow .12s}
.arow:hover{box-shadow:var(--shadow)}
.arow .at{display:flex;align-items:center;gap:8px}
.arow .at b{flex:1;font-size:15px;font-weight:700;letter-spacing:-.01em}
.arow .at .st{width:9px;height:9px;border-radius:50%;flex:none}
.arow .am{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.arow .am .warn{color:var(--red);font-weight:600}
.arow .prog{height:3px;border-radius:2px;background:var(--line);margin-top:9px;overflow:hidden}
.arow .prog i{display:block;height:100%;background:var(--green)}
.morebtn{display:block;width:100%;text-align:center;padding:8px;font-size:13px;font-weight:600;color:var(--accent);border-radius:10px}
.morebtn:hover{background:var(--accent-soft)}
.b-empty{margin:40px auto;max-width:420px;text-align:center;color:var(--muted);line-height:1.6}
.b-empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}

/* ---------- mapa (canvas) ---------- */
#viewport{position:fixed;inset:var(--top) 0 var(--tabs) 0;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--line2) 1px,transparent 1.5px);background-size:26px 26px}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges .hit{stroke:transparent;stroke-width:20;pointer-events:stroke;cursor:pointer}
#edges .vis{stroke:#B6C0D0;stroke-width:1.6;fill:none}
#edges g.sel .vis{stroke:var(--accent);stroke-width:3}
.card{position:absolute;width:212px;padding:11px 13px 10px;border-radius:11px;background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow);transform:translate(-50%,-50%);
  user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow-lg)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-lg)}
.card.dim{opacity:.15}
.card.done .t{color:var(--faint);text-decoration:line-through}
.card .k{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-bottom:5px}
.card .k .dot{width:7px;height:7px;border-radius:50%}
.card .k .st{margin-left:auto;width:8px;height:8px;border-radius:50%}
.card .t{font-size:14px;font-weight:600;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.card .meta:empty{display:none}
.card .chip{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:6px;padding:2px 7px;font-weight:500}
.card .chip.warn{color:var(--red);background:var(--red-soft)}
.card .chip.blk{color:var(--amber);background:var(--amber-soft)}
.card[data-kind=actividad]{width:236px;border-top:3px solid var(--k-actividad)}
.card[data-kind=actividad] .t{font-size:15px;font-weight:700}
.zoomctl{position:fixed;right:18px;bottom:calc(88px + var(--tabs) + env(safe-area-inset-bottom));z-index:61;
  display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;transition:right .22s cubic-bezier(.2,.8,.25,1)}
.zoomctl button{width:40px;height:38px;font-size:19px;color:var(--muted)}
.zoomctl button:hover{background:var(--bg);color:var(--ink)}

/* ---------- ＋ ---------- */
.fab{position:fixed;right:18px;bottom:calc(18px + var(--tabs) + env(safe-area-inset-bottom));z-index:62;
  width:58px;height:58px;border-radius:16px;background:var(--accent);color:#fff;font-size:30px;font-weight:300;
  display:grid;place-items:center;box-shadow:0 10px 28px rgba(27,92,255,.42);
  transition:transform .15s,right .22s cubic-bezier(.2,.8,.25,1)}
.fab:active{transform:scale(.94)}
@media(min-width:861px){body.panel-open .fab,body.panel-open .zoomctl{right:calc(18px + var(--panelw))}}
.newmenu{position:fixed;z-index:75;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-lg);padding:6px;width:216px;max-height:70vh;overflow:auto}
.newmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:9px;font-size:14.5px;font-weight:600;text-align:left}
.newmenu button:hover{background:var(--bg)}
.newmenu .dot{width:9px;height:9px;border-radius:50%;flex:none}
.newmenu small{margin-left:auto;color:var(--faint);font-weight:400;font-size:11.5px}
.newmenu .nmtitle{padding:8px 12px 4px;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}
.newmenu input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;outline:0;background:var(--bg);margin:4px 0}
.newmenu input:focus{border-color:var(--accent);background:#fff}
.scrim{position:fixed;inset:0;z-index:70}

/* ---------- panel ---------- */
.panel{position:fixed;top:var(--top);right:0;bottom:var(--tabs);width:var(--panelw);z-index:56;
  background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.25,1)}
.panel.open{transform:none;box-shadow:-16px 0 48px rgba(15,23,42,.08)}
.phead{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;flex:none}
.phead h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em;flex:1}
.phead .x,.phead .back{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:17px;flex:none}
.phead .x:hover,.phead .back:hover{background:var(--bg);color:var(--ink)}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 16px 90px}
.grp{margin:14px 0 4px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:7px}
.grp .n{color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 11px;border-radius:10px;border:1px solid transparent}
.row:hover{background:var(--bg)}
.row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:14px;font-weight:600;line-height:1.3;word-break:break-word}
.row .rt small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.row .st{width:8px;height:8px;border-radius:50%;flex:none}
.row .asg{flex:none;font-size:12px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:999px;padding:4px 10px}
.row .asg:hover{background:var(--red);color:#fff}
.row.done b{color:var(--faint);text-decoration:line-through}
.pempty{margin:18px 4px;padding:18px;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);font-size:13.5px;text-align:center;line-height:1.5}
.hintline{margin:10px 4px 0;font-size:12.5px;color:var(--faint);line-height:1.5}
.pulse{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.pulse .cell{border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.pulse .cell b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em}
.pulse .cell span{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.25;display:block;margin-top:1px}
.pulse .cell.bad b{color:var(--red)}
.pulse .cell.amb b{color:var(--amber)}
.pulse .cell.ok{opacity:.6}
.faltahead{font-size:14px;font-weight:700;margin:8px 4px 2px}
.faltahead b{color:var(--red)}

/* detalle */
.dkind{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.dkind .dot{width:8px;height:8px;border-radius:50%}
.dkind .conv{margin-left:auto;display:flex;gap:5px}
.dkind .conv button{font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:4px 9px}
.dtitle{width:100%;border:0;outline:0;resize:none;background:none;font-size:19px;font-weight:700;line-height:1.3;
  letter-spacing:-.01em;padding:6px 0 2px;font-family:inherit;overflow:hidden}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bg)}
.frow>label{width:96px;flex:none;font-size:12.5px;color:var(--muted);font-weight:500}
.frow input[type=text],.frow input[type=date],.frow input[type=number]{
  flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px;font-weight:600;padding:4px 0}
.frow input:focus{box-shadow:0 1px 0 var(--accent)}
.frow.blocked input{color:var(--amber)}
.seg{display:flex;gap:4px;flex:1}
.seg button{flex:1;padding:6px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--bg)}
.seg button.on[data-v=pendiente],.seg button.on[data-v=proxima]{background:var(--red-soft);color:var(--red)}
.seg button.on[data-v=progreso],.seg button.on[data-v=marcha]{background:var(--amber-soft);color:var(--amber)}
.seg button.on[data-v=hecho],.seg button.on[data-v=fin]{background:var(--green-soft);color:var(--green)}
.seg button.on[data-v=si]{background:var(--green-soft);color:var(--green)}
.seg button.on[data-v=no]{background:var(--accent-soft);color:var(--accent)}
.dnotes{width:100%;border:0;outline:0;resize:none;background:none;font-size:14px;line-height:1.55;color:var(--ink);
  padding:10px 0;min-height:44px;font-family:inherit;overflow:hidden}
.linkrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:9px}
.linkrow:hover{background:var(--bg)}
.linkrow .dot{width:7px;height:7px;border-radius:50%;flex:none}
.linkrow span{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow .un{color:var(--faint);font-size:15px;padding:2px 6px;border-radius:6px}
.linkrow .un:hover{color:var(--red);background:var(--red-soft)}
.addline{display:flex;align-items:center;gap:8px;margin-top:6px}
.addline input{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13.5px;outline:0;background:var(--bg)}
.addline input:focus{border-color:var(--accent);background:#fff}
.ghostbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft)}
.ghostbtn.gray{color:var(--muted);background:var(--bg)}
.dfoot{display:flex;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--bg)}
.dfoot .del{margin-left:auto;color:var(--red);background:var(--red-soft);padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600}
.money{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 10px;color:var(--muted)}
.money b{color:var(--ink);font-weight:600}
.money.total{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:700;color:var(--ink)}
.taskline{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:9px}
.taskline:hover{background:var(--bg)}
.taskline .bst{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center}
.taskline .bst i{width:9px;height:9px;border-radius:50%;display:block;pointer-events:none}
.taskline .bst:hover{background:var(--line)}
.taskline>span{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taskline.done>span{color:var(--faint);text-decoration:line-through}
.taskline small{color:var(--muted);font-size:12px;flex:none}
.taskline .asg{flex:none;font-size:11.5px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:999px;padding:3px 9px}

/* personas */
.prow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px;border-radius:11px}
.prow:hover{background:var(--bg)}
.prow .ava{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.prow .pt{flex:1;min-width:0}
.prow .pt b{display:block;font-size:14.5px;font-weight:600}
.prow .pt small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.prow .load{display:flex;gap:3px;flex:none}
.prow .load i{width:7px;height:16px;border-radius:3px;background:var(--line)}
.prow .load i.f{background:var(--accent)}
.prow .load i.hot{background:var(--red)}

/* identidad / toast */
.iddlg{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(15,23,42,.35);backdrop-filter:blur(3px)}
.iddlg .box{background:var(--panel);border-radius:18px;box-shadow:var(--shadow-lg);padding:26px 24px;width:min(340px,90vw);text-align:center}
.iddlg h2{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
.iddlg p{margin:0 0 16px;font-size:13.5px;color:var(--muted);line-height:1.5}
.iddlg input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;font-size:16px;outline:0;text-align:center;font-weight:600}
.iddlg input:focus{border-color:var(--accent)}
.iddlg .go{width:100%;margin-top:12px;background:var(--accent);color:#fff;border-radius:11px;padding:12px;font-weight:700;font-size:15px}
.iddlg .skip{margin-top:8px;color:var(--faint);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--tabs) + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
  z-index:90;background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;border-radius:10px;padding:10px 16px;
  opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* móvil */
.tabbar{display:none}
@media (max-width:860px){
  :root{--tabs:calc(58px + env(safe-area-inset-bottom));--panelw:100vw}
  .topnav,.gsearch,.viewtog{display:none}
  .brand{margin:0 auto 0 0}
  .zoomctl{display:none}
  #viewport{display:none!important}
  #tablero{padding:16px 14px 120px}
  .phead .x{display:none}
  .panel{border-left:0}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--tabs);z-index:65;
    background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:10.5px;font-weight:600;color:var(--muted);border-radius:10px;position:relative}
  .tabbar button.on{color:var(--accent)}
  .tabbar button svg{width:21px;height:21px}
  .tabbar .badge{top:0;right:calc(50% - 20px)}
}
</style>
</head>
<body>

<header class="top">
  <span class="brand"><i></i><b>SPE</b><span>Organización</span></span>
  <div class="viewtog"><button id="vTab" class="on">Tablero</button><button id="vMap">Mapa</button></div>
  <label class="gsearch">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar…" autocomplete="off">
  </label>
  <nav class="topnav">
    <button id="navFalta">⚡ ¿Qué falta?<span class="badge zero" id="faltaBadge"></span></button>
    <button id="navMio">Mi SPE</button>
  </nav>
</header>

<div id="tablero"><div class="board" id="board"></div></div>

<div id="viewport" hidden>
  <div id="world">
    <svg id="edges" width="10" height="10"></svg>
    <div id="cards"></div>
  </div>
</div>

<div class="zoomctl" id="zoomctl" hidden><button id="zin">+</button><button id="zout">−</button></div>
<button class="fab" id="fab" aria-label="Crear">＋</button>

<aside class="panel" id="panel">
  <div class="phead">
    <button class="back" id="pback" hidden>←</button>
    <h2 id="ptitle"></h2>
    <button class="x" id="pclose">✕</button>
  </div>
  <div class="pbody" id="pbody"></div>
</aside>

<nav class="tabbar" id="tabbar">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>Tablero</button>
  <button data-tab="falta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>Qué falta<span class="badge zero" id="faltaBadge2"></span></button>
  <button data-tab="mio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg>Mi SPE</button>
  <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar</button>
</nav>

<div class="toast" id="toast"></div>

<script src="js/red-config.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   CONSTANTES / HELPERS
============================================================ */
const KINDS = {
  actividad:{label:'Actividad', plural:'Actividades', color:'var(--k-actividad)', hint:'evento, charla, visita…'},
  tarea:    {label:'Tarea',     plural:'Tareas',      color:'var(--k-tarea)',     hint:'algo que hay que hacer'},
  idea:     {label:'Idea',      plural:'Ideas',       color:'var(--k-idea)',      hint:''},
  persona:  {label:'Persona',   plural:'Personas',    color:'var(--k-persona)',   hint:'miembro, profesor, contacto'},
  empresa:  {label:'Empresa',   plural:'Empresas',    color:'var(--k-empresa)',   hint:'industria, sponsor'},
  nota:     {label:'Nota',      plural:'Notas',       color:'var(--k-nota)',      hint:''}
};
const T_EST={pendiente:['Pendiente','var(--red)'],progreso:['En progreso','var(--amber)'],hecho:['Hecho','var(--green)']};
const A_EST={proxima:['Próxima','var(--red)'],marcha:['En marcha','var(--amber)'],fin:['Finalizada','var(--green)']};
const CYCLE={pendiente:'progreso',progreso:'hecho',hecho:'pendiente'};

const $=s=>document.querySelector(s);
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isMobile=()=>matchMedia('(max-width:860px)').matches;
const norm=s=>(s||'').trim().toLowerCase();
const fmt$=n=>'$'+Number(n).toLocaleString('es-AR');
const hoy=()=>new Date().toISOString().slice(0,10);
const fmtFecha=f=>{if(!f)return'';const[y,m,d]=f.split('-');return d+'/'+m+(y!=new Date().getFullYear()?'/'+y.slice(2):'')};

/* ============================================================
   ESTADO
============================================================ */
let items={}, edges={};
let view={x:0,y:0,k:1};
let sel=null, dragging=null, searchQ='';
let yo=localStorage.getItem('spe-yo')||'';
let vista=localStorage.getItem('spe-vista')||'tab';   // 'tab' | 'map'
let expanded={};                                       // grupos del tablero expandidos

/* ============================================================
   ALMACENAMIENTO (Firebase RTDB o localStorage) — sin cambios
============================================================ */
const store=(function(){
  const cfg=(typeof RED_FIREBASE_CONFIG!=='undefined')?RED_FIREBASE_CONFIG:null;
  const listeners=[];
  const emit=(kind,id,data)=>listeners.forEach(f=>f(kind,id,data));
  if(cfg&&cfg.databaseURL){
    let db=null,loaded=0;
    const boot=()=>{
      firebase.initializeApp(cfg);db=firebase.database();
      ['items','edges'].forEach(kind=>{
        const ref=db.ref('mesa/'+kind);
        ref.on('child_added',s=>emit(kind+':set',s.key,s.val()));
        ref.on('child_changed',s=>emit(kind+':set',s.key,s.val()));
        ref.on('child_removed',s=>emit(kind+':del',s.key,null));
      });
    };
    const tag=src=>{const e=document.createElement('script');e.src=src;
      e.onload=()=>{if(++loaded===2)boot()};document.head.appendChild(e)};
    tag('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
    tag('https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js');
    return {mode:'nube',onChange:f=>listeners.push(f),
      saveItem:(id,d)=>db&&db.ref('mesa/items/'+id).set(d),
      delItem:id=>db&&db.ref('mesa/items/'+id).remove(),
      saveEdge:(id,d)=>db&&db.ref('mesa/edges/'+id).set(d),
      delEdge:id=>db&&db.ref('mesa/edges/'+id).remove()};
  }
  const KEY='spe-mesa-v1';
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{items:{},edges:{}}}catch(e){return{items:{},edges:{}}}};
  const save=()=>localStorage.setItem(KEY,JSON.stringify({items,edges}));
  setTimeout(()=>{
    const d=load();
    Object.keys(d.items).forEach(id=>emit('items:set',id,d.items[id]));
    Object.keys(d.edges).forEach(id=>emit('edges:set',id,d.edges[id]));
  },0);
  addEventListener('storage',e=>{
    if(e.key!==KEY)return;
    const d=load();
    Object.keys(items).forEach(id=>{if(!d.items[id])emit('items:del',id,null)});
    Object.keys(edges).forEach(id=>{if(!d.edges[id])emit('edges:del',id,null)});
    Object.keys(d.items).forEach(id=>emit('items:set',id,d.items[id]));
    Object.keys(d.edges).forEach(id=>emit('edges:set',id,d.edges[id]));
  });
  return {mode:'local',onChange:f=>listeners.push(f),
    saveItem:(id,d)=>{save();emit('items:set',id,d)},
    delItem:id=>{save();emit('items:del',id,null)},
    saveEdge:(id,d)=>{save();emit('edges:set',id,d)},
    delEdge:id=>{save();emit('edges:del',id,null)}};
})();

store.onChange((kind,id,data)=>{
  if(kind==='items:set'){
    if(dragging===id)return;
    items[id]=data;renderCard(id);renderEdgesOf(id);
    if(panel.mode==='item'&&panel.itemId===id)fillDetail(id);
    softRefresh();
  }else if(kind==='items:del'){
    delete items[id];
    if(cardEls[id]){cardEls[id].remove();delete cardEls[id]}
    Object.keys(edges).forEach(eid=>{const e=edges[eid];
      if(e&&(e.a===id||e.b===id)){delete edges[eid];removeEdgeEl(eid);store.delEdge(eid)}});
    if(panel.mode==='item'&&panel.itemId===id)closePanel();
    softRefresh();
  }else if(kind==='edges:set'){
    edges[id]=data;renderEdge(id);
    if(panel.mode==='item')fillLinks(panel.itemId);
    softRefresh();
  }else if(kind==='edges:del'){
    delete edges[id];removeEdgeEl(id);
    if(panel.mode==='item')fillLinks(panel.itemId);
    softRefresh();
  }
});

let refreshQueued=false;
function softRefresh(){
  if(refreshQueued)return;
  refreshQueued=true;
  /* setTimeout y no requestAnimationFrame: los cambios de otros
     miembros tienen que aplicarse aunque la pestaña esté de fondo */
  setTimeout(()=>{
    refreshQueued=false;
    updateFaltaBadge();
    if(vista==='tab')renderBoard();
    if(['falta','mio','search','gente','person'].includes(panel.mode))renderPanel(panel.mode);
    if(panel.mode==='item'&&panel.itemId)fillActBlock(panel.itemId);
    backupSoon();
  });
}
/* copia de seguridad local automática: aunque la nube se borre,
   cada dispositivo guarda el último estado que vio */
function backupSoon(){
  deb('backup',()=>{
    if(!Object.keys(items).length)return;
    try{localStorage.setItem('spe-mesa-backup',JSON.stringify({t:Date.now(),items,edges}))}catch(e){}
  },2000);
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({exportado:new Date().toISOString(),items,edges},null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='spe-copia-'+hoy()+'.json';
  a.click();
  toast('Copia guardada en Descargas');
}

function saveItem(id){items[id].updatedAt=Date.now();store.saveItem(id,items[id]);softRefresh()}
function newItem(kind,x,y,preset){
  const id=uid();
  items[id]=Object.assign({kind,title:'',x:Math.round(x),y:Math.round(y),
    who:'',estado:kind==='tarea'?'pendiente':(kind==='actividad'?'proxima':''),
    fecha:'',monto:null,detail:'',contacto:'',sponsor:false,blocked:'',
    createdBy:yo,createdAt:Date.now(),updatedAt:Date.now()},preset||{});
  renderCard(id);store.saveItem(id,items[id]);softRefresh();
  return id;
}
function deleteItem(id){
  delete items[id];
  if(cardEls[id]){cardEls[id].remove();delete cardEls[id]}
  Object.keys(edges).forEach(eid=>{const e=edges[eid];
    if(e&&(e.a===id||e.b===id)){delete edges[eid];removeEdgeEl(eid);store.delEdge(eid)}});
  store.delItem(id);softRefresh();
}
function link(a,b){
  if(a===b)return;
  if(Object.values(edges).some(e=>e&&((e.a===a&&e.b===b)||(e.a===b&&e.b===a))))return;
  const id=uid();edges[id]={a,b};renderEdge(id);store.saveEdge(id,edges[id]);
}
function linkedIds(id){
  const out=[];
  Object.values(edges).forEach(e=>{
    if(!e)return;
    if(e.a===id&&items[e.b])out.push(e.b);
    if(e.b===id&&items[e.a])out.push(e.a);
  });
  return out;
}
/* actividad a la que pertenece una tarea (la primera conectada) */
const actOf=id=>linkedIds(id).find(x=>items[x]&&items[x].kind==='actividad')||null;
const tasksOf=actId=>linkedIds(actId).filter(x=>items[x]&&items[x].kind==='tarea');

/* ============================================================
   LÓGICA OPERATIVA: atención / bloqueos / carga
============================================================ */
const isOpenTask=it=>it.kind==='tarea'&&it.estado!=='hecho';
const isVencida=it=>isOpenTask(it)&&it.fecha&&it.fecha<hoy();
const isBlocked=it=>isOpenTask(it)&&!!(it.blocked||'').trim();
const needsAttn=it=>isOpenTask(it)&&(!it.who||isVencida(it)||isBlocked(it));
function attnReason(it){
  if(!it.who)return['sin responsable','ven'];
  if(isBlocked(it))return['⚠ '+it.blocked,'blk'];
  if(isVencida(it))return['vencida '+fmtFecha(it.fecha),'ven'];
  return null;
}
function counts(){
  let rojo=0,amarillo=0,verde=0;
  Object.values(items).forEach(it=>{
    if(it.kind!=='tarea')return;
    if(it.estado==='hecho'){verde++;return}
    if(needsAttn(it)){rojo++;return}
    if(it.estado==='progreso')amarillo++;
  });
  return{rojo,amarillo,verde};
}
function calcFalta(){
  const t=Object.keys(items).filter(id=>items[id].kind==='tarea'&&items[id].estado!=='hecho');
  return{
    sinResp:t.filter(id=>!items[id].who),
    bloq:t.filter(id=>isBlocked(items[id])),
    venc:t.filter(id=>isVencida(items[id])),
    actsSF:Object.keys(items).filter(id=>items[id].kind==='actividad'
      &&['marcha','proxima'].includes(items[id].estado)&&!items[id].fecha),
    abiertas:t
  };
}
function updateFaltaBadge(){
  const f=calcFalta();
  const n=new Set([...f.sinResp,...f.bloq,...f.venc]).size+f.actsSF.length;
  [$('#faltaBadge'),$('#faltaBadge2')].forEach(b=>{
    if(!b)return;b.textContent=n;b.classList.toggle('zero',n===0);
  });
}
/* nombres conocidos: items persona + responsables usados + yo */
function knownNames(){
  const map={};
  const add=n=>{const k=norm(n);if(k&&!map[k])map[k]=n.trim()};
  if(yo)add(yo);
  Object.values(items).forEach(it=>{
    if(it.kind==='persona'&&it.title)add(it.title);
    if(it.who)add(it.who);
  });
  return Object.values(map).sort((a,b)=>a.localeCompare(b));
}

/* ============================================================
   TABLERO
============================================================ */
const boardEl=$('#board');
function taskCtxLine(it,id,showWho){
  const bits=[];
  const act=actOf(id);
  if(act)bits.push(`<span class="ctx">${esc(items[act].title)||'Actividad'}</span>`);
  const r=attnReason(it);
  if(r&&it.who)bits.push(`<span class="${r[1]}">${esc(r[0])}</span>`);
  if(it.fecha&&!isVencida(it))bits.push(fmtFecha(it.fecha));
  if(it.monto)bits.push(fmt$(it.monto));
  if(showWho&&it.who)bits.push('👤 '+esc(it.who));
  return bits.length?`<small>${bits.join('')}</small>`:'';
}
function browHTML(id){
  const it=items[id];
  const stCol=(T_EST[it.estado]||T_EST.pendiente)[1];
  const right=it.who
    ?`<span class="who">${esc(it.who)}</span>`
    :(it.estado!=='hecho'?`<button class="asg" data-asg="${id}">Asignar</button>`:'');
  return `<div class="brow${it.estado==='hecho'?' done':''}" data-open="${id}">
    <button class="bst" data-cycle="${id}" title="Cambiar estado"><i style="background:${stCol}"></i></button>
    <div class="bt"><b>${esc(it.title)||'Sin título'}</b>${taskCtxLine(it,id,false)}</div>${right}</div>`;
}
function arowHTML(id){
  const it=items[id];
  const ts=tasksOf(id);
  const open=ts.filter(x=>items[x].estado!=='hecho');
  const done=ts.length-open.length;
  const attn=open.filter(x=>needsAttn(items[x])).length;
  const stCol=(A_EST[it.estado]||A_EST.proxima)[1];
  const m=[];
  if(it.who)m.push('👤 '+esc(it.who));
  if(it.fecha)m.push('📅 '+fmtFecha(it.fecha));
  if(ts.length)m.push(done+'/'+ts.length+' tareas');
  if(attn)m.push(`<span class="warn">⚠ ${attn} necesita${attn>1?'n':''} atención</span>`);
  const tot=actTotal(id);
  if(tot)m.push('💰 '+fmt$(tot));
  return `<button class="arow" data-open="${id}">
    <span class="at"><span class="st" style="background:${stCol}"></span><b>${esc(it.title)||'Sin título'}</b></span>
    ${m.length?`<span class="am">${m.join('<span></span>')}</span>`:''}
    ${ts.length?`<span class="prog"><i style="width:${Math.round(done/ts.length*100)}%"></i></span>`:''}
  </button>`;
}
function actTotal(id){
  let tot=Number(items[id].monto)||0;
  tasksOf(id).forEach(x=>{tot+=Number(items[x].monto)||0});
  return tot;
}
function sortTasks(ids){
  return ids.sort((a,b)=>{
    const fa=items[a].fecha||'9999',fb=items[b].fecha||'9999';
    return fa<fb?-1:fa>fb?1:(items[b].updatedAt||0)-(items[a].updatedAt||0);
  });
}
function capList(ids,html,key,cap){
  cap=cap||8;
  if(ids.length<=cap||expanded[key])
    return ids.map(html).join('')+(ids.length>cap?`<button class="morebtn" data-collapse="${key}">mostrar menos</button>`:'');
  return ids.slice(0,cap).map(html).join('')+
    `<button class="morebtn" data-expand="${key}">ver ${ids.length-cap} más</button>`;
}
function renderBoard(){
  const all=Object.keys(items);
  const c=counts();
  const fechaHumana=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  let h=`<div class="hoy"><h1>Hoy</h1><span class="fecha">${fechaHumana}</span>
    <button class="gente" data-panel="gente">👥 Personas</button></div>
  <div class="stats">
    <button class="stat rojo" data-panel="falta"><span class="led" style="background:var(--red)"></span><b>${c.rojo}</b> necesitan atención</button>
    <span class="stat"><span class="led" style="background:var(--amber)"></span><b>${c.amarillo}</b> en progreso</span>
    <span class="stat"><span class="led" style="background:var(--green)"></span><b>${c.verde}</b> resueltas</span>
  </div>`;

  if(!all.length){
    h+=`<div class="b-empty"><b>Empezá acá</b>Creá la primera actividad o tarea con el botón <b style="display:inline;color:var(--accent)">＋</b>.<br>Todo el chapter va a ver lo mismo.</div>`;
    boardEl.innerHTML=h;bindBoard();return;
  }

  const tareas=all.filter(id=>items[id].kind==='tarea');
  const attn=sortTasks(tareas.filter(id=>needsAttn(items[id])));
  if(attn.length)
    h+=`<div class="bsec"><h2><span class="led" style="background:var(--red)"></span>Necesita atención<span class="n">${attn.length}</span></h2>`
      +capList(attn,browHTML,'attn')+`</div>`;

  const acts=all.filter(id=>items[id].kind==='actividad');
  const enCurso=acts.filter(id=>items[id].estado==='marcha')
    .concat(acts.filter(id=>items[id].estado==='proxima'))
    .sort((a,b)=>(items[a].fecha||'9999')<(items[b].fecha||'9999')?-1:1);
  const fin=acts.filter(id=>items[id].estado==='fin');
  if(enCurso.length||fin.length){
    h+=`<div class="bsec"><h2><span class="led" style="background:var(--k-actividad)"></span>Actividades<span class="n">${enCurso.length}</span>`+
      (fin.length?`<button data-expand="fin">${expanded['fin']?'ocultar':'finalizadas'} · ${fin.length}</button>`:'')+`</h2>`+
      enCurso.map(arowHTML).join('')+
      (expanded['fin']?fin.map(arowHTML).join(''):'')+`</div>`;
  }

  const prog=sortTasks(tareas.filter(id=>items[id].estado==='progreso'&&!needsAttn(items[id])));
  if(prog.length)
    h+=`<div class="bsec"><h2><span class="led" style="background:var(--amber)"></span>En progreso<span class="n">${prog.length}</span></h2>`
      +capList(prog,browHTML,'prog')+`</div>`;

  const pend=sortTasks(tareas.filter(id=>items[id].estado==='pendiente'&&!needsAttn(items[id])));
  if(pend.length)
    h+=`<div class="bsec"><h2><span class="led" style="background:var(--faint)"></span>Pendiente<span class="n">${pend.length}</span></h2>`
      +capList(pend,browHTML,'pend')+`</div>`;

  const done=tareas.filter(id=>items[id].estado==='hecho')
    .sort((a,b)=>(items[b].updatedAt||0)-(items[a].updatedAt||0));
  if(done.length)
    h+=`<div class="bsec"><h2><span class="led" style="background:var(--green)"></span>Hecho<span class="n">${done.length}</span>`+
      `<button data-expand="done">${expanded['done']?'ocultar':'ver'}</button></h2>`+
      (expanded['done']?capList(done,browHTML,'doneList',15):'')+`</div>`;

  const libres=all.filter(id=>['idea','nota'].includes(items[id].kind));
  if(libres.length)
    h+=`<div class="bsec"><h2><span class="led" style="background:var(--k-idea)"></span>Ideas y notas<span class="n">${libres.length}</span>`+
      `<button data-expand="ideas">${expanded['ideas']?'ocultar':'ver'}</button></h2>`+
      (expanded['ideas']?libres.map(id=>{
        const it=items[id],K=KINDS[it.kind];

const viewport=$('#viewport'),world=$('#world'),edgesSvg=$('#edges'),cardsLayer=$('#cards');
const cardEls={},edgeEls={};
function applyView(){
  world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  viewport.style.backgroundPosition=view.x+'px '+view.y+'px';
  viewport.style.backgroundSize=(26*view.k)+'px '+(26*view.k)+'px';
}
const s2w=(px,py)=>({x:(px-view.x)/view.k,y:(py-view.y)/view.k});
function statusDot(it){
  if(it.kind==='tarea')return T_EST[it.estado]?T_EST[it.estado][1]:null;
  if(it.kind==='actividad')return A_EST[it.estado]?A_EST[it.estado][1]:null;
  return null;
}
function renderCard(id){
  const it=items[id];if(!it)return;
  let el=cardEls[id];
  if(!el){
    el=document.createElement('div');el.className='card';el.dataset.id=id;
    cardsLayer.appendChild(el);cardEls[id]=el;bindCard(el,id);
  }
  el.dataset.kind=it.kind;
  el.classList.toggle('done',it.kind==='tarea'&&it.estado==='hecho');
  el.classList.toggle('sel',sel===id);
  const K=KINDS[it.kind]||KINDS.nota;
  const st=statusDot(it);
  const meta=[];
  if(it.who)meta.push(`<span class="chip">${esc(it.who)}</span>`);
  else if(it.kind==='tarea'&&it.estado!=='hecho')meta.push(`<span class="chip warn">sin responsable</span>`);
  if(isBlocked(it))meta.push(`<span class="chip blk">⚠ bloqueada</span>`);
  if(it.fecha)meta.push(`<span class="chip">${fmtFecha(it.fecha)}</span>`);
  if(it.monto)meta.push(`<span class="chip">${fmt$(it.monto)}</span>`);
  el.innerHTML=`<div class="k"><span class="dot" style="background:${K.color}"></span>${K.label}`+
    (st?`<span class="st" style="background:${st}"></span>`:'')+`</div>`+
    `<div class="t">${esc(it.title)||'<span style="color:var(--faint)">Sin título</span>'}</div>`+
    `<div class="meta">${meta.join('')}</div>`;
  el.style.left=it.x+'px';el.style.top=it.y+'px';
  applySearchDim(id);
}
function renderEdge(id){
  const e=edges[id];if(!e)return;
  const a=items[e.a],b=items[e.b];if(!a||!b)return;
  let g=edgeEls[id];
  if(!g){
    g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.innerHTML='<path class="vis"/><path class="hit"/>';
    g.addEventListener('click',ev=>{ev.stopPropagation();onEdgeTap(id)});
    edgesSvg.appendChild(g);edgeEls[id]=g;
  }
  const d=`M${a.x} ${a.y} L${b.x} ${b.y}`;
  g.querySelector('.vis').setAttribute('d',d);
  g.querySelector('.hit').setAttribute('d',d);
}
const renderEdgesOf=nid=>Object.keys(edges).forEach(eid=>{
  const e=edges[eid];if(e&&(e.a===nid||e.b===nid))renderEdge(eid)});
const removeEdgeEl=id=>{if(edgeEls[id]){edgeEls[id].remove();delete edgeEls[id]}};
function onEdgeTap(id){
  const g=edgeEls[id];if(!g)return;
  if(g.classList.contains('sel')){delete edges[id];removeEdgeEl(id);store.delEdge(id)}
  else{
    g.classList.add('sel');
    toast('Tocá la línea otra vez para quitar la conexión');
    setTimeout(()=>{if(edgeEls[id])edgeEls[id].classList.remove('sel')},2600);
  }
}
const pointers={};let panStart=null,pinchStart=null;
viewport.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('.card'))return;
  try{viewport.setPointerCapture(ev.pointerId)}catch(e){}
  pointers[ev.pointerId]={x:ev.clientX,y:ev.clientY};
  const ids=Object.keys(pointers);
  if(ids.length===1){panStart={px:ev.clientX,py:ev.clientY,vx:view.x,vy:view.y,moved:false};viewport.classList.add('panning')}
  else if(ids.length===2){
    const p1=pointers[ids[0]],p2=pointers[ids[1]];
    pinchStart={d:Math.hypot(p1.x-p2.x,p1.y-p2.y),k:view.k,cx:(p1.x+p2.x)/2,cy:(p1.y+p2.y)/2,vx:view.x,vy:view.y};
    panStart=null;
  }
});
viewport.addEventListener('pointermove',ev=>{
  if(!pointers[ev.pointerId])return;
  pointers[ev.pointerId]={x:ev.clientX,y:ev.clientY};
  const ids=Object.keys(pointers);
  if(pinchStart&&ids.length>=2){
    const p1=pointers[ids[0]],p2=pointers[ids[1]];
    const d=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    const k=Math.min(2.5,Math.max(.2,pinchStart.k*d/pinchStart.d));
    const cx=(p1.x+p2.x)/2,cy=(p1.y+p2.y)/2;
    view.k=k;
    view.x=cx-((pinchStart.cx-pinchStart.vx)/pinchStart.k)*k;
    view.y=cy-((pinchStart.cy-pinchStart.vy)/pinchStart.k)*k;
    applyView();
  }else if(panStart){
    const dx=ev.clientX-panStart.px,dy=ev.clientY-panStart.py;
    if(Math.abs(dx)+Math.abs(dy)>4)panStart.moved=true;
    view.x=panStart.vx+dx;view.y=panStart.vy+dy;applyView();
  }
});
const endPtr=ev=>{
  delete pointers[ev.pointerId];
  if(Object.keys(pointers).length<2)pinchStart=null;
  if(!Object.keys(pointers).length){viewport.classList.remove('panning');panStart=null}
};
viewport.addEventListener('pointerup',endPtr);
viewport.addEventListener('pointercancel',endPtr);
viewport.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const k=Math.min(2.5,Math.max(.2,view.k*(ev.deltaY<0?1.1:0.9)));
  const w=s2w(ev.clientX,ev.clientY);
  view.x=ev.clientX-w.x*k;view.y=ev.clientY-w.y*k;view.k=k;applyView();
},{passive:false});
function zoomC(f){
  const cx=innerWidth/2,cy=innerHeight/2;
  const k=Math.min(2.5,Math.max(.2,view.k*f));
  const w=s2w(cx,cy);
  view.x=cx-w.x*k;view.y=cy-w.y*k;view.k=k;applyView();
}
$('#zin').addEventListener('click',()=>zoomC(1.22));
$('#zout').addEventListener('click',()=>zoomC(0.82));
viewport.addEventListener('dblclick',ev=>{
  if(ev.target.closest('.card'))return;
  openNewMenu(ev.clientX,ev.clientY,s2w(ev.clientX,ev.clientY));
});
viewport.addEventListener('click',ev=>{
  if(ev.target.closest('.card'))return;
  if(sel){const o=sel;sel=null;if(items[o])renderCard(o)}
});
function bindCard(el,id){
  let st=null;
  el.addEventListener('pointerdown',ev=>{
    ev.stopPropagation();
    try{el.setPointerCapture(ev.pointerId)}catch(e){}
    const it=items[id];
    st={px:ev.clientX,py:ev.clientY,nx:it.x,ny:it.y,moved:false};
  });
  el.addEventListener('pointermove',ev=>{
    if(!st)return;
    const dx=(ev.clientX-st.px)/view.k,dy=(ev.clientY-st.py)/view.k;
    if(Math.abs(dx)+Math.abs(dy)>3/view.k){st.moved=true;dragging=id}
    if(st.moved){
      items[id].x=st.nx+dx;items[id].y=st.ny+dy;
      el.style.left=items[id].x+'px';el.style.top=items[id].y+'px';
      renderEdgesOf(id);
    }
  });
  el.addEventListener('pointerup',()=>{
    if(!st)return;
    const moved=st.moved;st=null;
    if(moved){dragging=null;saveItem(id)}
    else{
      const o=sel;sel=id;
      if(o&&items[o])renderCard(o);
      renderCard(id);openItem(id);
    }
  });
  el.addEventListener('pointercancel',()=>{st=null;dragging=null});
}

let menuEls=[];
function placeMenu(m,anchor){
  document.body.appendChild(m);
  const scr=document.createElement('div');scr.className='scrim';
  scr.addEventListener('click',closeMenus);
  document.body.insertBefore(scr,m);
  menuEls.push(scr,m);
  const r=anchor.getBoundingClientRect?anchor.getBoundingClientRect():anchor;
  const W=m.offsetWidth,H=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(r.left,innerWidth-W-8))+'px';
  m.style.top=Math.max(8,Math.min((r.top||r.y)-H-8>8?(r.top||r.y)-H-8:(r.bottom||r.y)+8,innerHeight-H-8))+'px';
}
function closeMenus(){menuEls.forEach(e=>e.remove());menuEls=[]}

function creationContext(){
  /* si hay un detalle abierto, usarlo de contexto */
  if(panel.mode==='item'&&panel.itemId&&items[panel.itemId]){
    const it=items[panel.itemId];
    if(it.kind==='actividad')return{type:'act',id:panel.itemId,label:it.title};
    if(it.kind==='persona')return{type:'who',name:it.title,label:it.title};
  }
  if(panel.mode==='person'&&panel.param)return{type:'who',name:panel.param,label:panel.param};
  return null;
}
function openNewMenu(px,py,worldPos){

  if(ctx&&ctx.label)h+=`<div class="nmtitle">${ctx.type==='act'?'En '+esc(ctx.label):'Para '+esc(ctx.label)}</div>`;

    (KINDS[k].hint?`<small>${KINDS[k].hint}</small>`:'')+`</button>`).join('');

  placeMenu(m,{left:px,y:py,top:py});

const panel={el:$('#panel'),mode:null,itemId:null,param:null,prev:null,isNew:false};

function openPanel(mode,itemId,param){

  if(mode!=='item')panel.prev=null;
  cleanupNewEmpty();
  panel.mode=mode;panel.itemId=itemId||null;panel.param=param||null;

  renderPanel(mode);

function cleanupNewEmpty(){

  if(panel.isNew&&panel.itemId&&items[panel.itemId]&&!items[panel.itemId].title.trim()){
    deleteItem(panel.itemId);

function rowHTML(id,opts){

/* ---------- ⚡ QUÉ FALTA (resolver en el lugar) ---------- */
function renderFalta(){
  ptitle.textContent='⚡ ¿Qué falta?';
  const f=calcFalta();
  const total=new Set([...f.sinResp,...f.bloq,...f.venc]).size+f.actsSF.length;
  const cell=(n,txt,cls)=>`<div class="cell ${n?cls:'ok'}"><b>${n}</b><span>${txt}</span></div>`;
  let h='';
  if(total)h+=`<p class="faltahead"><b>${total}</b> ${total===1?'cosa está frenando':'cosas están frenando'} el trabajo</p>`;
  h+=`<div class="pulse">`+
    cell(f.sinResp.length,'sin responsable','bad')+
    cell(f.bloq.length,'bloqueadas','amb')+
    cell(f.venc.length,'vencidas','bad')+
    cell(f.actsSF.length,'actividades sin fecha','')+`</div>`;
  const g=(t,ids,opts)=>ids.length?`<div class="grp">${t}<span class="n">${ids.length}</span></div>`+
    ids.map(id=>rowHTML(id,opts)).join(''):'';
  h+=g('Sin responsable — asignar resuelve',f.sinResp,{quickAssign:true});
  h+=g('Bloqueadas',f.bloq.filter(id=>!f.sinResp.includes(id)));
  h+=g('Vencidas',f.venc.filter(id=>!f.sinResp.includes(id)&&!f.bloq.includes(id)));
  h+=g('Actividades sin fecha',f.actsSF);
  if(!total)h+=`<div class="pempty">✔ Nada está frenando el trabajo.<br>Todo lo abierto tiene responsable, fecha y camino libre.</div>`;
  pbody.innerHTML=h;
}

/* ---------- MI SPE ---------- */
function renderMio(){
  ptitle.textContent='Mi SPE';
  if(!yo){
    pbody.innerHTML=`<div class="pempty">Decinos quién sos para mostrarte lo tuyo.</div>
      <div class="addline"><input id="yoIn" placeholder="Tu nombre" autocomplete="off"><button class="ghostbtn" id="yoGo">Listo</button></div>`;
    $('#yoGo').addEventListener('click',()=>{
      const v=$('#yoIn').value.trim();if(!v)return;
      yo=v;localStorage.setItem('spe-yo',v);renderMio();
    });
    return;
  }
  const mias=Object.keys(items).filter(id=>items[id].kind==='tarea'&&norm(items[id].who)===norm(yo));
  const abiertas=mias.filter(id=>items[id].estado!=='hecho');
  const ahora=sortTasks(abiertas.filter(id=>{
    const it=items[id];return isVencida(it)||isBlocked(it)||(it.estado==='pendiente'&&!it.fecha);
  }));
  const curso=sortTasks(abiertas.filter(id=>items[id].estado==='progreso'&&!ahora.includes(id)));
  const prox=sortTasks(abiertas.filter(id=>!ahora.includes(id)&&!curso.includes(id)));
  const hechas=mias.length-abiertas.length;
  const g=(t,ids)=>ids.length?`<div class="grp">${t}<span class="n">${ids.length}</span></div>`+ids.map(id=>rowHTML(id)).join(''):'';
  let h=`<div class="hintline">Sos <b style="color:var(--ink)">${esc(yo)}</b> · <a href="#" id="yoChg" style="color:var(--accent)">cambiar</a></div>`;
  h+=g('🔴 Ahora',ahora)+g('🟡 En curso',curso)+g('📅 Próximo',prox);
  if(!abiertas.length)h+=`<div class="pempty">No tenés nada pendiente.<br>Mirá <b>⚡ ¿Qué falta?</b> y agarrá algo.</div>`;
  if(hechas)h+=`<div class="hintline">🟢 ${hechas} hecha${hechas>1?'s':''}</div>`;
  const libres=calcFalta().sinResp.length;
  if(libres)h+=`<div style="margin-top:14px"><button class="ghostbtn gray" id="verLibres">⚡ El chapter necesita: ${libres} tarea${libres>1?'s':''} sin responsable</button></div>`;
  pbody.innerHTML=h;
  const c=$('#yoChg');if(c)c.addEventListener('click',ev=>{ev.preventDefault();yo='';localStorage.removeItem('spe-yo');renderMio()});
  const v=$('#verLibres');if(v)v.addEventListener('click',()=>openPanel('falta'));
}

/* ---------- PERSONAS ---------- */
function personLoads(){
  const map={};
  Object.keys(items).forEach(id=>{
    const it=items[id];
    if(it.kind!=='tarea'||!it.who)return;
    const k=norm(it.who);
    if(!map[k])map[k]={name:it.who.trim(),open:0,blocked:0,done:0};
    if(it.estado==='hecho')map[k].done++;
    else{map[k].open++;if(isBlocked(it))map[k].blocked++}
  });
  Object.values(items).forEach(it=>{
    if(it.kind==='persona'&&it.title){
      const k=norm(it.title);
      if(!map[k])map[k]={name:it.title.trim(),open:0,blocked:0,done:0};
    }
  });
  return Object.values(map).sort((a,b)=>b.open-a.open);
}
function renderGente(){
  ptitle.textContent='Personas';
  const loads=personLoads();
  const sinR=calcFalta().sinResp.length;
  let h='';
  if(sinR)h+=`<button class="row" data-panel-falta style="border:1px solid var(--red-soft);background:var(--red-soft)">
    <span class="dot" style="background:var(--red)"></span>
    <span class="rt"><b style="color:var(--red)">${sinR} tarea${sinR>1?'s':''} sin nadie</b><small>tocá para repartirlas</small></span></button>`;
  const max=Math.max(1,...loads.map(l=>l.open));
  h+=loads.map(l=>{
    const ini=l.name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const bars=[1,2,3,4,5].map(i=>`<i class="${l.open>=i*max/5?'f':''} ${l.open>=4&&i>3?'hot':''}"></i>`).join('');
    const sub=[l.open?l.open+' abierta'+(l.open>1?'s':''):'libre'];
    if(l.blocked)sub.push('⚠ '+l.blocked+' bloqueada'+(l.blocked>1?'s':''));
    if(l.done)sub.push(l.done+' hecha'+(l.done>1?'s':''));
    return `<button class="prow" data-person="${esc(l.name)}"><span class="ava">${ini}</span>
      <span class="pt"><b>${esc(l.name)}</b><small>${sub.join(' · ')}</small></span>
      <span class="load">${bars}</span></button>`;
  }).join('');
  if(!loads.length)h+=`<div class="pempty">Todavía no hay nadie con tareas.</div>`;
  pbody.innerHTML=h;
  const fr=pbody.querySelector('[data-panel-falta]');
  if(fr)fr.addEventListener('click',()=>openPanel('falta'));
}
function renderPerson(name){
  ptitle.textContent=name;
  $('#pback').hidden=false;
  panel.prev='gente';
  const ids=Object.keys(items).filter(id=>items[id].kind==='tarea'&&norm(items[id].who)===norm(name));
  const abiertas=sortTasks(ids.filter(id=>items[id].estado!=='hecho'));
  const hechas=ids.filter(id=>items[id].estado==='hecho').slice(-8);
  const g=(t,list)=>list.length?`<div class="grp">${t}<span class="n">${list.length}</span></div>`+list.map(id=>rowHTML(id)).join(''):'';
  let h=g('Abiertas',abiertas)+g('Hechas',hechas);
  if(!ids.length)h=`<div class="pempty">${esc(name)} no tiene tareas.</div>`;
  h+=`<div style="margin-top:14px"><button class="ghostbtn" id="addForPerson">＋ Tarea para ${esc(name)}</button></div>`;
  pbody.innerHTML=h;
  $('#addForPerson').addEventListener('click',()=>{
    const pos=s2w(innerWidth*.5,innerHeight*.45);
    const id=newItem('tarea',pos.x,pos.y,{who:name});
    openItem(id,true);
  });
}

/* ---------- BÚSQUEDA ---------- */
function renderSearch(){
  ptitle.textContent='Buscar';
  const q=norm(searchQ);
  let h='';
  if(isMobile())
    h+=`<div class="addline" style="margin:4px 0 8px"><input id="qm" placeholder="Buscar en todo el SPE…" value="${esc(searchQ)}" autocomplete="off"></div>`;
  if(q){
    const hits=Object.keys(items).filter(id=>{
      const it=items[id];
      return norm(it.title+' '+it.who+' '+(it.detail||'')+' '+(it.contacto||'')+' '+(it.blocked||'')).includes(q);
    });
    const byKind={};
    hits.forEach(id=>{(byKind[items[id].kind]=byKind[items[id].kind]||[]).push(id)});
    Object.keys(KINDS).forEach(k=>{
      if(byKind[k])h+=`<div class="grp">${KINDS[k].plural}<span class="n">${byKind[k].length}</span></div>`+byKind[k].map(id=>rowHTML(id)).join('');
    });
    if(!hits.length)h+=`<div class="pempty">Nada con “${esc(searchQ)}”.</div>`;
  }else{
    h+=`<button class="row" data-panel-gente><span class="dot" style="background:var(--k-persona)"></span><span class="rt"><b>👥 Personas</b><small>quién está haciendo qué</small></span></button>`;
    h+=`<button class="row" data-export><span class="dot" style="background:var(--faint)"></span><span class="rt"><b>⬇ Copia de seguridad</b><small>descarga todo en un archivo</small></span></button>`;
    if(isMobile())h+=`<div class="pempty">Buscá personas, empresas, tareas, actividades…</div>`;
  }
  pbody.innerHTML=h;
  const gp=pbody.querySelector('[data-panel-gente]');
  if(gp)gp.addEventListener('click',()=>openPanel('gente'));
  const ex=pbody.querySelector('[data-export]');
  if(ex)ex.addEventListener('click',exportJSON);
  const qm=$('#qm');
  if(qm){
    qm.addEventListener('input',()=>{searchQ=qm.value;renderSearch();
      const el=$('#qm');el.focus();el.setSelectionRange(el.value.length,el.value.length)});
    if(document.activeElement!==qm&&!searchQ)qm.focus();
  }
}
function applySearchDim(id){
  const el=cardEls[id];if(!el)return;
  const q=norm(searchQ);
  if(!q){el.classList.remove('dim');return}
  const it=items[id];
  el.classList.toggle('dim',!norm(it.title+' '+it.who+' '+(it.detail||'')).includes(q));
}
$('#q').addEventListener('input',function(){
  searchQ=this.value;
  Object.keys(cardEls).forEach(applySearchDim);
  if(searchQ){if(panel.mode!=='search')openPanel('search');else renderSearch()}
  else if(panel.mode==='search')closePanel();
});

/* ---------- DETALLE ---------- */
function openItem(id,isNew){
  if(!items[id])return;
  flushDebounces();
  const o=sel;sel=id;
  if(o&&items[o])renderCard(o);
  renderCard(id);
  if(vista==='map'&&!isMobile()){
    const it=items[id];
    const visW=innerWidth-392;
    view.x=visW/2-it.x*view.k;view.y=(innerHeight-56)/2+56-it.y*view.k;applyView();
  }
  openPanel('item',id);
  panel.isNew=!!isNew;
  if(isNew)setTimeout(()=>{const t=$('#dTitle');if(t)t.focus()},60);
}

let debounces={};
function deb(key,fn,ms){
  if(debounces[key])clearTimeout(debounces[key].t);
  const rec={fn};
  rec.t=setTimeout(()=>{delete debounces[key];fn()},ms||450);
  debounces[key]=rec;
}
const debPending=key=>!!debounces[key];
function flushDebounces(){
  Object.keys(debounces).forEach(k=>{
    clearTimeout(debounces[k].t);
    const f=debounces[k].fn;delete debounces[k];f();
  });
}
addEventListener('pagehide',flushDebounces);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushDebounces()});

function renderDetail(id){
  const it=items[id];if(!it)return closePanel();
  const K=KINDS[it.kind]||KINDS.nota;
  ptitle.textContent='';
  const seg=opts=>`<div class="seg" data-f="estado">`+Object.keys(opts).map(v=>
    `<button data-v="${v}" class="${it.estado===v?'on':''}">${opts[v][0]}</button>`).join('')+`</div>`;
  const conv=['idea','nota'].includes(it.kind)
    ?`<span class="conv"><button data-conv="tarea">→ Tarea</button><button data-conv="actividad">→ Actividad</button></span>`:'';
  let h=`<div class="dkind"><span class="dot" style="background:${K.color}"></span>${K.label}${conv}</div>
  <textarea class="dtitle" id="dTitle" rows="1" placeholder="${it.kind==='actividad'?'Nombre de la actividad…':it.kind==='tarea'?'Qué hay que hacer…':it.kind==='empresa'?'Nombre de la empresa…':it.kind==='persona'?'Nombre…':'Escribí acá…'}">${esc(it.title)}</textarea>`;
  if(it.kind==='tarea')h+=`<div class="frow"><label>Estado</label>${seg(T_EST)}</div>`;
  if(it.kind==='actividad')h+=`<div class="frow"><label>Estado</label>${seg(A_EST)}</div>`;
  if(['tarea','actividad'].includes(it.kind)){
    h+=`<div class="frow"><label>${it.kind==='actividad'?'Organiza':'Responsable'}</label>
      <input type="text" id="dWho" value="${esc(it.who)}" placeholder="nadie todavía" autocomplete="off"></div>`;
    h+=`<div class="frow"><label>Fecha</label><input type="date" id="dFecha" value="${it.fecha||''}"></div>`;
    h+=`<div class="frow"><label>Presupuesto</label><input type="number" id="dMonto" value="${it.monto||''}" placeholder="$ opcional" min="0"></div>`;
  }
  if(it.kind==='tarea')
    h+=`<div class="frow blocked"><label>⚠ Frenada por</label><input type="text" id="dBlock" value="${esc(it.blocked||'')}" placeholder="nada — escribí el motivo si está bloqueada" autocomplete="off"></div>`;
  if(it.kind==='empresa'){
    h+=`<div class="frow"><label>Contacto</label><input type="text" id="dContacto" value="${esc(it.contacto||'')}" placeholder="persona, mail, teléfono" autocomplete="off"></div>`;
    h+=`<div class="frow"><label>Sponsor</label><div class="seg" data-f="sponsor">
      <button data-v="si" class="${it.sponsor?'on':''}">Sí</button>
      <button data-v="no" class="${!it.sponsor?'on':''}">No</button></div></div>`;
  }
  if(it.kind==='persona')
    h+=`<div class="frow"><label>Contacto</label><input type="text" id="dContacto" value="${esc(it.contacto||'')}" placeholder="mail, teléfono, rol" autocomplete="off"></div>`;
  h+=`<textarea class="dnotes" id="dNotes" placeholder="Notas…">${esc(it.detail||'')}</textarea>`;
  h+=`<div id="dActBlock"></div>`;
  h+=`<div class="grp">Conectado con</div><div id="dLinks"></div>
  <div class="addline" id="linkAdd" hidden><input id="linkQ" placeholder="Buscar para conectar…" autocomplete="off"></div>
  <div id="linkResults"></div>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="ghostbtn gray" id="btnLink">⇄ Conectar</button>
    ${it.kind==='actividad'?'<button class="ghostbtn" id="btnQuickTask">＋ Tarea</button>':''}
  </div>
  <div class="dfoot"><span style="font-size:12px;color:var(--faint);align-self:center">${it.createdBy?'creado por '+esc(it.createdBy):''}</span>
    <button class="del" id="dDel">Borrar</button></div>`;
  pbody.innerHTML=h;
  fillActBlock(id);
  fillLinks(id);
  bindDetail(id);
}

/* bloque de tareas + presupuesto dentro de una actividad */
function fillActBlock(id){
  const box=$('#dActBlock');
  if(!box||panel.itemId!==id)return;
  const it=items[id];
  if(!it||it.kind!=='actividad'){box.innerHTML='';return}
  const ts=sortTasks(tasksOf(id));
  let h='';
  if(ts.length){
    h+=`<div class="grp">Tareas<span class="n">${ts.filter(x=>items[x].estado==='hecho').length}/${ts.length}</span></div>`;
    h+=ts.map(x=>{
      const t=items[x];
      const col=(T_EST[t.estado]||T_EST.pendiente)[1];
      const extra=isBlocked(t)?`<small style="color:var(--amber)">⚠</small>`:(t.fecha?`<small>${fmtFecha(t.fecha)}</small>`:'');
      const right=t.who?`<small>${esc(t.who)}</small>`:`<button class="asg" data-asg="${x}">Asignar</button>`;
      return `<div class="taskline${t.estado==='hecho'?' done':''}" data-open="${x}" style="cursor:pointer">
        <button class="bst" data-cycle="${x}"><i style="background:${col}"></i></button>
        <span>${esc(t.title)||'Sin título'}</span>${extra}${right}</div>`;
    }).join('');
  }
  const withMonto=ts.filter(x=>items[x].monto>0);
  if(withMonto.length||it.monto>0){
    h+=`<div class="grp">Presupuesto</div>`;
    let tot=0;
    withMonto.forEach(x=>{tot+=Number(items[x].monto);
      h+=`<div class="money"><span>${esc(items[x].title)||'—'}</span><b>${fmt$(items[x].monto)}</b></div>`});
    if(it.monto>0){tot+=Number(it.monto);h+=`<div class="money"><span>General</span><b>${fmt$(it.monto)}</b></div>`}
    h+=`<div class="money total"><span>TOTAL</span><b>${fmt$(tot)}</b></div>`;
  }
  box.innerHTML=h;
}

function fillLinks(id){
  const box=$('#dLinks');if(!box||panel.itemId!==id)return;
  const it=items[id];
  let ids=linkedIds(id);
  if(it&&it.kind==='actividad')ids=ids.filter(x=>items[x].kind!=='tarea'); // las tareas ya se listan arriba
  box.innerHTML=ids.length?ids.map(x=>{
    const o=items[x],K=KINDS[o.kind]||KINDS.nota;
    return `<div class="linkrow" data-open="${x}" style="cursor:pointer"><span class="dot" style="background:${K.color}"></span>
      <span>${esc(o.title)||'Sin título'}</span><button class="un" data-unlink="${x}" title="Quitar conexión">✕</button></div>`;
  }).join(''):`<div class="hintline" style="margin-top:2px">Nada conectado todavía.</div>`;
  box.querySelectorAll('[data-unlink]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    const other=b.dataset.unlink;
    Object.keys(edges).forEach(eid=>{
      const e=edges[eid];
      if(e&&((e.a===id&&e.b===other)||(e.b===id&&e.a===other))){
        delete edges[eid];removeEdgeEl(eid);store.delEdge(eid);
      }
    });
    fillLinks(id);softRefresh();
  }));
}
const autoGrow=t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};

function bindDetail(id){
  const T=$('#dTitle');
  autoGrow(T);
  T.addEventListener('input',()=>{autoGrow(T);
    deb('t'+id,()=>{if(!items[id])return;items[id].title=T.value.trim();renderCard(id);saveItem(id)})});
  T.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){
      ev.preventDefault();
      if(panel.isNew&&T.value.trim()){       // captura rápida: Enter crea y listo
        flushDebounces();
        const t=items[id]&&items[id].title;
        closePanel();
        toast('Creada ✓'+(t?'':''));
      }else T.blur();
    }
  });
  const N=$('#dNotes');
  autoGrow(N);
  N.addEventListener('input',()=>{autoGrow(N);
    deb('n'+id,()=>{if(!items[id])return;items[id].detail=N.value;saveItem(id)})});
  const W=$('#dWho');
  if(W)W.addEventListener('input',()=>deb('w'+id,()=>{if(!items[id])return;items[id].who=W.value.trim();renderCard(id);saveItem(id)}));
  const F=$('#dFecha');
  if(F)F.addEventListener('change',()=>{if(!items[id])return;items[id].fecha=F.value;renderCard(id);saveItem(id)});
  const M=$('#dMonto');
  if(M)M.addEventListener('input',()=>deb('m'+id,()=>{if(!items[id])return;items[id].monto=M.value?Number(M.value):null;renderCard(id);saveItem(id)}));
  const C=$('#dContacto');
  if(C)C.addEventListener('input',()=>deb('c'+id,()=>{if(!items[id])return;items[id].contacto=C.value.trim();saveItem(id)}));
  const B=$('#dBlock');
  if(B)B.addEventListener('input',()=>deb('b'+id,()=>{if(!items[id])return;items[id].blocked=B.value.trim();renderCard(id);saveItem(id)}));

  pbody.querySelectorAll('.seg[data-f=estado] button').forEach(b=>b.addEventListener('click',()=>{
    if(!items[id])return;
    items[id].estado=b.dataset.v;
    if(b.dataset.v==='hecho')items[id].blocked='';
    pbody.querySelectorAll('.seg[data-f=estado] button').forEach(x=>x.classList.toggle('on',x===b));
    renderCard(id);saveItem(id);
  }));
  pbody.querySelectorAll('.seg[data-f=sponsor] button').forEach(b=>b.addEventListener('click',()=>{
    if(!items[id])return;
    items[id].sponsor=b.dataset.v==='si';
    pbody.querySelectorAll('.seg[data-f=sponsor] button').forEach(x=>x.classList.toggle('on',x===b));
    saveItem(id);
  }));
  pbody.querySelectorAll('[data-conv]').forEach(b=>b.addEventListener('click',()=>{
    if(!items[id])return;
    const k=b.dataset.conv;
    items[id].kind=k;
    items[id].estado=k==='tarea'?'pendiente':'proxima';
    renderCard(id);saveItem(id);renderDetail(id);
    toast('Convertida en '+KINDS[k].label.toLowerCase());
  }));
  $('#dDel').addEventListener('click',()=>{
    if(!confirm('¿Borrar esto? Lo deja de ver todo el grupo.'))return;
    panel.isNew=false;
    deleteItem(id);closePanel();
  });
  $('#btnLink').addEventListener('click',()=>{
    const box=$('#linkAdd');box.hidden=!box.hidden;
    if(!box.hidden){$('#linkQ').focus();renderLinkResults(id,'')}
    else $('#linkResults').innerHTML='';
  });
  $('#linkQ').addEventListener('input',function(){renderLinkResults(id,this.value)});
  const qt=$('#btnQuickTask');
  if(qt)qt.addEventListener('click',()=>{
    const act=items[id];
    const tid=newItem('tarea',act.x+Math.random()*160-80,act.y+120+Math.random()*60);
    link(id,tid);
    openItem(tid,true);
  });
}
function renderLinkResults(id,q){
  const box=$('#linkResults');if(!box)return;
  const already=new Set(linkedIds(id));
  const nq=norm(q);
  const hits=Object.keys(items).filter(x=>x!==id&&!already.has(x)&&
    (!nq||norm(items[x].title+' '+items[x].who).includes(nq))).slice(0,8);
  box.innerHTML=hits.map(x=>{
    const it=items[x],K=KINDS[it.kind]||KINDS.nota;
    return `<button class="linkrow" data-link="${x}"><span class="dot" style="background:${K.color}"></span>
      <span>${esc(it.title)||'Sin título'}</span><span style="font-size:11px;color:var(--faint)">${K.label}</span></button>`;
  }).join('');
  box.querySelectorAll('[data-link]').forEach(b=>b.addEventListener('click',()=>{
    link(id,b.dataset.link);
    $('#linkAdd').hidden=true;box.innerHTML='';
    fillLinks(id);fillActBlock(id);
    toast('Conectado');
  }));
}
function fillDetail(id){
  const it=items[id];if(!it)return;
  const set=(sid,val,key)=>{const e=$(sid);
    if(e&&document.activeElement!==e&&!debPending(key))e.value=val};
  set('#dTitle',it.title,'t'+id);set('#dNotes',it.detail||'','n'+id);set('#dWho',it.who||'','w'+id);
  set('#dFecha',it.fecha||'');set('#dMonto',it.monto||'','m'+id);set('#dContacto',it.contacto||'','c'+id);
  set('#dBlock',it.blocked||'','b'+id);
  pbody.querySelectorAll('.seg[data-f=estado] button').forEach(b=>b.classList.toggle('on',b.dataset.v===it.estado));
  fillActBlock(id);
}

/* ============================================================
   IDENTIDAD / TOAST / ARRANQUE
============================================================ */
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
if(!yo){
  const d=document.createElement('div');d.className='iddlg';
  d.innerHTML=`<div class="box"><h2>SPE · Organización</h2>
    <p>Acá se ve qué hay que hacer, quién lo hace y qué falta. Decinos tu nombre — sin cuentas ni contraseñas.</p>
    <input id="idIn" placeholder="Tu nombre" autocomplete="off" maxlength="30">
    <button class="go" id="idGo">Entrar</button>
    <button class="skip" id="idSkip">Ahora no</button></div>`;
  document.body.appendChild(d);
  const go=()=>{const v=$('#idIn').value.trim();if(v){yo=v;localStorage.setItem('spe-yo',v)}d.remove();boot()};
  $('#idGo').addEventListener('click',go);
  $('#idIn').addEventListener('keydown',ev=>{if(ev.key==='Enter')go()});
  $('#idSkip').addEventListener('click',()=>{d.remove();boot()});
}else boot();
function boot(){
  view.x=innerWidth*(isMobile()?.5:.42);view.y=innerHeight*.48;applyView();
  setVista(isMobile()?'tab':vista);
  updateFaltaBadge();
}
})();
